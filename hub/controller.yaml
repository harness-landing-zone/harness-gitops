# Day-0 values for the official upstream harness-gitops-agent-controller chart
# (https://harness.github.io/gitops-helm, v0.1.0), installed by
# workshop/2-clusters/hub.tf into hga-system.

image:
  repository: harness/gitops-agent-bootstrap-controller

crds:
  enabled: true
  keep: true

manager:
  # Defaults to this release namespace (hga-system). The controller reads
  # harness-api-key-secret (ACCOUNT) and harness-api-key-<tenant> (ORG) from here.
  zapDevelopment: false
