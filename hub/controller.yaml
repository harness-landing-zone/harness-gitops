# Day-0 values for the HGA controller, installed by workshop/2-clusters
# (hub.tf, release hga-controller).

# The official image is public. No tag here: the chart's appVersion is the
# tested controller version.
image:
  repository: harness/gitops-agent-bootstrap-controller

# The chart templates its CRDs so they upgrade with it. keep leaves existing
# agent CRs in place on a helm uninstall.
crds:
  enabled: true
  keep: true

manager:
  # apiKeySecretNamespace is left unset on purpose: it defaults to this
  # release namespace, hga-system. The controller reads the ONE central
  # API-key Secret from there for every agent CR in every namespace. The hub
  # agent release (hub/account-agent.yaml) creates that Secret.
  zapDevelopment: false
