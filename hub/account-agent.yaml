# Day-0 values for the ACCOUNT-scoped hub agent, installed by
# workshop/2-clusters (hub.tf, release hga-hub-agent) from charts/gitops-agent.
# Static values only. hub.tf adds the per-hub inputs on top (agent name and
# identifier, token Secret, account, environment, repository and revision, the
# hub-admin project mapping) and the keys through set_sensitive, so secrets
# reach only Kubernetes and never git.
#
# No image versions are set here on purpose: the official chart's own defaults
# for Argo CD, redis and the agent are the tested combination.

# The ONE central API-key Secret, harness-api-key-secret: gitops-helm's
# default for gitopsAgent.harnessAgent.spec.apiKeySecretRef, which this file
# leaves unset. The controller reads it from its own namespace, hga-system,
# for this hub agent. Hub-managed spoke agents use their tenant's key:
# hub.tf adds one entry per tenant under apiKeySecret.extra
# (harness-api-key-TENANT, named in spec.apiKeySecretRef by the agents group).
apiKeySecret:
  create: true
  namespace: hga-system

# The group installer selects the hub by fleet_member and reads its repository
# settings from the annotations hub.tf sets.
hubCluster:
  enabled: true
  labels:
    # The add-ons this hub runs (groups/addons.yaml selects on these).
    enable_external_secrets: "true"
    enable_openbao: "true"

rootAppSet:
  enabled: true
  project: default
  # Creates AppProject default as a hook, see gitopsAgent.appProject below.
  createProject: true

gitopsAgent:
  enabled: true
  harnessAgent:
    enabled: true
    spec:
      scope: ACCOUNT
  # The official appProject template refuses to render until the AppProject
  # CRD exists, and this release installs that CRD, so it stays off. The root
  # ApplicationSet hook creates the AppProject named by rootAppSet.project
  # instead (rootAppSet.createProject); description is read from here.
  appProject:
    enabled: false
    description: Admin AppProject for the hub
  harness:
    gitopsServerHost: https://app.harness.io/prod1/gitops
    configMap:
      logLevel: INFO
      reconcile:
        appsetReconcile: true
  argo-cd:
    crds:
      install: true
      keep: true
    configs:
      cm:
        cluster.inClusterEnabled: true
