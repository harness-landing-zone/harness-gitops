# Day-0 static values for the PE Admin ACCOUNT-scoped agent, installed directly
# from the official upstream gitops-helm chart (https://harness.github.io/gitops-helm,
# v1.3.0) by workshop/2-clusters/hub.tf into hga-hub-agent.
#
# Per-hub identity, projectMappings, and gitopsServerHost are layered in by hub.tf.
# Day-0 glue (API keys, hub-cluster Secret, platform-admin AppProject, root
# ApplicationSet) is installed immediately after by charts/hub-bootstrap.

harnessAgent:
  enabled: true
  spec:
    scope: ACCOUNT

appProject:
  enabled: false

# Disabled: the controller manages the agent's token Secret (existingSecrets).
upgrader:
  enabled: false

harness:
  createClusterRoles: true
  configMap:
    logLevel: INFO
    reconcile:
      appsetReconcile: true

agent:
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

argo-cd:
  crds:
    install: true
    keep: true
  configs:
    params:
      server.repo.server.timeout.seconds: "300"
      controller.repo.server.timeout.seconds: "300"
    cm:
      cluster.inClusterEnabled: "true"
      # Distinct tracking label for the PE Admin Argo CD so it never collides
      # with lower-privilege Org Argo CDs running on the same cluster.
      application.instanceLabelKey: pe.argocd.argoproj.io/instance
      # Custom health checks for Harness GitOps CRDs so sync waves wait for
      # registration/mappings and failures surface as Degraded.
      resource.customizations.health.gitops.harness.io_HarnessGitopsAgent: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.conditions ~= nil then
            for _, c in ipairs(obj.status.conditions) do
              if c.type == "Healthy" and c.status == "True" then
                hs.status = "Healthy"
                hs.message = c.message
                return hs
              end
            end
          end
          if obj.status.agentIdentifier ~= nil and obj.status.agentIdentifier ~= "" then
            hs.status = "Healthy"
            hs.message = "Agent registered (" .. obj.status.agentIdentifier .. ")"
            return hs
          end
          if obj.status.conditions ~= nil then
            for _, c in ipairs(obj.status.conditions) do
              if c.status == "False" and c.type ~= "Healthy" then
                hs.status = "Degraded"
                hs.message = c.message
                return hs
              end
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for controller to register Harness GitOps agent"
        return hs
      resource.customizations.health.gitops.harness.io_HarnessGitopsProjectMapping: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, c in ipairs(obj.status.conditions) do
            if c.type == "Ready" then
              if c.status == "True" then
                hs.status = "Healthy"
                hs.message = c.message
                return hs
              else
                hs.status = "Progressing"
                hs.message = c.message
                return hs
              end
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for Harness project mapping verification"
        return hs
  controller:
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: 1, memory: 2Gi}
  applicationSet:
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  repoServer:
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {cpu: 1, memory: 1Gi}
    # Harness CMP plugin sidecar off by default (saves 1 CPU / 1Gi per Argo CD).
    extraContainers: []
  redis:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
