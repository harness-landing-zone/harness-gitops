# Day-0 static values for charts/hub-bootstrap, installed by
# workshop/2-clusters/hub.tf immediately after upstream gitops-helm.
# Per-hub inputs and sensitive API keys are layered in by hub.tf.

apiKeySecret:
  create: true
  name: harness-api-key-secret
  namespace: hga-system
  keep: true

hubCluster:
  enabled: true
  name: hub-cluster
  labels:
    # ESO: builds every cluster Secret (local delivery tokens and spoke
    # connections from the store).
    enable_external_secrets: "true"
    # OpenBao (dev mode) + ClusterSecretStore hub-secret-store: where each
    # spoke's tofu writes its connection (clusters/<spoke>).
    enable_openbao: "true"

rootAppSet:
  enabled: true
  name: fleet-root
  path: bootstrap
  project: platform-admin
  createProject: true
  # Chart repositories the platform-admin project may install from.
  allowedChartRepos:
    - https://harness.github.io/gitops-helm
    - https://charts.external-secrets.io
    - https://openbao.github.io/openbao-helm
