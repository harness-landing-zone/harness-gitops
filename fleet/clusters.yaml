# Cluster registrations: one file per registration, clusters/<agent>/<cluster>.yaml.
#   <agent>   folder   = the agent's namespace it registers into
#   <cluster> filename = the Argo CD cluster Secret name in that namespace
#   mode      in file  = local (default: target is this hub) or remote (via ESO store)
# Deleting a file deregisters the cluster: applicationsSync sync, no preserve.
applicationSets:
  registrations:
    selector:
      matchLabels:
        fleet_member: hub-cluster
    gitFiles: clusters/*/*.yaml
    name: 'cluster-{{ index .path.segments 1 }}-{{ trimSuffix ".yaml" .path.filename }}'
    labels:
      agent: '{{ index .path.segments 1 }}'
      cluster: '{{ trimSuffix ".yaml" .path.filename }}'
      cluster_mode: '{{ default "local" (index . "mode") }}'
      tenant: '{{ default "" (index . "tenant") }}'
      environment: '{{ default "" (index . "environment") }}'
    destination:
      name: hub-cluster
      namespace: '{{ index .path.segments 1 }}'
    syncPolicyAppSet:
      preserveResourcesOnDeletion: false
      applicationsSync: sync
    syncPolicy:
      automated:
        selfHeal: true
        prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    sources:
      - ref: values
      - path: charts/fleet-secret
        helm:
          releaseName: '{{ index .path.segments 1 }}-{{ trimSuffix ".yaml" .path.filename }}'
          # A hub admin registration has no tenant, so the team glob may match
          # nothing; that is the only reason missing files are allowed here.
          ignoreMissingValueFiles: true
          valueFiles:
            - '$values/tenants/{{ default "none" (index . "tenant") }}/teams/*/values.yaml'
            - '$values/{{ .path.path }}/{{ .path.filename }}'
          # Only what is computed from the filename or the hub cluster Secret;
          # mode, tenant and environment come from the cluster file itself.
          parameters:
            - name: cluster.name
              value: '{{ trimSuffix ".yaml" .path.filename }}'
              forceString: true
            - name: remote.annotations.repo_url
              value: '{{ .metadata.annotations.repo_url }}'
              forceString: true
            - name: remote.annotations.repo_revision
              value: '{{ default "HEAD" (index .metadata.annotations "repo_revision") }}'
              forceString: true
            - name: remote.annotations.harness_account_id
              value: '{{ .metadata.annotations.harness_account_id }}'
              forceString: true
