# Team A in org bu1:
# - charts/agent-onboarding creates allowlisted AppProject team-a and Harness
#   mapping to bu1/team_a.
# - charts/fleet-secret (mode: local) creates namespace team-a-apps with PSA
#   and a least-privilege workload RoleBinding for the cluster's delivery SA.
teams:
  team-a:
    projectId: team_a
    description: Team A (bu1)
    sourceRepos:
      - https://github.com/argoproj/argocd-example-apps.git
    namespaces:
      - team-a-apps
    destinations:
      - server: https://kubernetes.default.svc.cluster.local
        namespace: team-a-*
