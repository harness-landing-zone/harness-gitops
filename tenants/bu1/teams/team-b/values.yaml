# Team B in org bu1:
# - charts/agent-onboarding creates allowlisted AppProject team-b and Harness
#   mapping to bu1/team_b.
# - charts/fleet-secret (mode: local) creates namespace team-b-apps with PSA
#   and a least-privilege workload RoleBinding for the cluster's delivery SA.
teams:
  team-b:
    projectId: team_b
    description: Team B (bu1)
    sourceRepos:
      - https://github.com/argoproj/argocd-example-apps.git
    namespaces:
      - team-b-apps
    destinations:
      # Any cluster registered into this agent (fleet-registration/<agent>/clusters/).
      - name: "*"
        namespace: team-b-*
