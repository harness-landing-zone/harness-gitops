# spoke-prod is a bu1 cluster because this file exists. The folder name is the
# Argo CD cluster name and the cluster Secret's name; ESO builds that Secret
# from OpenBao clusters/spoke-prod (written by local/k3d.sh register). Only the
# connection is in the store; never put a credential here.
# Read by bootstrap/cluster-registration.yaml (charts/cluster-registration).

# The stage folder of tenants/bu1/gitops-agents/ (label stage).
stage: prod
# true: label fleet_member=spoke, so spoke-bootstrap installs the GitOps agent.
gitopsAgent: true
