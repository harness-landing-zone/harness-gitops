# Business unit bu1 (Harness org bu1) on every spoke labelled
# business_unit: bu1 and environment: nonprod. Read by
# bootstrap/spoke-bootstrap.yaml, which sets the agent's identity, scope and
# key itself. Plain values only: Argo cannot resolve Harness expressions.

# The upgrade group: these spokes run the charts and the values below from this
# revision of the repo. Bump nonprod first, then prod once nonprod is healthy.
# Pin a commit SHA or a tag; HEAD follows main and is only for the first test.
revision: HEAD

gitopsAgent:
  harness:
    gitopsServerHost: https://app.harness.io/prod1/gitops
  # One team = one Harness project = one AppProject on the spoke, plus its
  # deny-all shadow beside the agent object on the hub.
  projectMappings:
    - name: team-a
      appProject: team-a
      projectId: team_a
    - name: team-b
      appProject: team-b
      projectId: team_b

# What every team AppProject on the spoke may use.
destinationNamespaces:
  - dev
  - test
sourceRepos:
  - https://github.com/argoproj/argocd-example-apps.git
