# bu1 spokes labelled stage: nonprod, layered over ../defaults/values.yaml.
# Each team here has a mapping below and a file teams/<team>/values.yaml with
# its AppProject; the chart refuses a mapping without its AppProject.

gitopsAgent:
  # One per team: its AppProject and the Harness project in org bu1 it maps to
  # (the project must exist first: OpenTofu).
  projectMappings:
    - name: team-a
      appProject: team-a
      projectId: team_a
    - name: team-b
      appProject: team-b
      projectId: team_b
