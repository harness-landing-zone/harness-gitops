# Team b on every bu1 spoke (any stage): everything about the team in one file, read by
# charts/teams-bootstrap. Keyed by the team name, so every team file merges
# into one map. The name is the AppProject, the mapping and the prefix of
# every namespace.
teams:
  team-b:
    # The Harness project in org bu1 the team maps to (created by OpenTofu).
    projectId: team_b
    description: Team b, bu1
    # Exact repository URLs the team's Applications may pull from.
    sourceRepos:
      - https://github.com/argoproj/argocd-example-apps.git
    # Created by the platform: teams cannot create namespaces themselves.
    namespaces:
      - team-b-dev
    # Where on this spoke the team may deploy: any namespace starting team-b-.
    destinations:
      - server: https://kubernetes.default.svc
        namespace: team-b-*
