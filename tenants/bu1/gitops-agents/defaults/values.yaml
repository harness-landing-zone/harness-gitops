# Every bu1 GitOps agent (spoke cluster Secrets labelled tenant: bu1, any
# stage). Teams every stage gets are teams/<team>/values.yaml beside this file;
# a stage folder (nonprod/, prod/) can override them or add its own.
# Read by the spoke-runtime entry in groups/agents.yaml. The agent's
# name, identity, org, scope and key come from the cluster Secret, not from
# here.
# Plain values only: Argo cannot resolve Harness expressions.

gitopsAgent:
  harness:
    gitopsServerHost: https://app.harness.io/prod1/gitops
