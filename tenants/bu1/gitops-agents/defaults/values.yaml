# Every bu1 GitOps agent (spoke cluster Secrets labelled tenant: bu1, any
# stage). The stage folder (nonprod/, prod/) adds its teams on top.
# Read by bootstrap/spoke-runtime.yaml. The agent's name, identity, org, scope
# and key come from the cluster Secret, not from here.
# Plain values only: Argo cannot resolve Harness expressions.

gitopsAgent:
  harness:
    gitopsServerHost: https://app.harness.io/prod1/gitops
