# Installs External Secrets Operator on the hub itself, from the upstream chart
# (pinned). One Application per hub cluster Secret: hub-cluster-external-secrets,
# namespace external-secrets, AppProject default (so Harness lists it under the
# hub's admin project).
#
# Selected on fleet_member: hub-cluster alone; spoke Secrets carry
# fleet_member: spoke and never match. When a second hub needs ESO switched
# off, add the label enable_external_secrets: "true" here and on the hub
# cluster Secret (hubCluster.labels in hub/account-agent.yaml), as Fleet
# Management does.
#
# Values are optional and layered: addons/hub/defaults/external-secrets, then
# addons/hub/environments/<environment>/external-secrets. Neither exists yet;
# the chart's defaults (CRDs, controller, cert-controller, webhook) are enough.
#
# No metadata.namespace: the root Application applies this into the hub
# agent's namespace. A selector that matches nothing still reports success, so
# check with `kubectl get applications`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-external-secrets
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting the Application leaves ESO and its CRDs running.
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: hub-cluster
  template:
    metadata:
      name: '{{ .name }}-external-secrets'
      labels:
        app.kubernetes.io/part-of: hub-addons
    spec:
      project: default
      destination:
        name: '{{ .name }}'
        namespace: external-secrets
      sources:
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: HEAD
          ref: values
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 2.15.0
          helm:
            releaseName: external-secrets
            ignoreMissingValueFiles: true
            valueFiles:
              - '$values/addons/hub/defaults/external-secrets/values.yaml'
              - '$values/addons/hub/environments/{{ .metadata.labels.environment }}/external-secrets/values.yaml'
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        syncOptions:
          - CreateNamespace=true
          # The ESO CRDs exceed the client-side annotation limit.
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 1m
