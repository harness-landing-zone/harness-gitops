# The hub half of an agent on every spoke: per spoke cluster Secret
# (fleet_member: spoke), one Application <spoke>-registration on the hub, in
# namespace <spoke>. It holds the ORG-scoped HarnessGitopsAgent, one project
# mapping per team and deny-all shadow AppProjects. The controller registers
# the agent and writes its token here; the token is then carried to the spoke
# (local/carry-token.sh <env> <spoke>-agent-token).
#
# The spoke half is bootstrap/spoke-runtime.yaml. Keep the identity values
# below equal in both files: the agent's name, identifier, org and token name.
#
# Values, lowest first: tenants/<tenant>/gitops-agents/defaults/values.yaml,
# <stage>/values.yaml (required; its revision is the upgrade group: bump
# nonprod first, then prod), clusters/<spoke>/values.yaml (optional), then the
# valuesObject below, which no tenant file can override. Agent identity is
# immutable, so never rename a spoke's cluster Secret.
#
# No metadata.namespace: the root Application applies this into the hub
# agent's namespace. A selector or path that matches nothing still reports
# success, so check with `kubectl get applications`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: agent-registration
spec:
  goTemplate: true
  # Templates read cluster metadata and paths, plus the stage file's revision.
  # If revision is missing, generation stops for every spoke, and the existing
  # Applications keep their last revision.
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting an Application never deletes the agent object, whose finalizer
    # would deregister the agent in Harness.
    preserveResourcesOnDeletion: true
    # Never delete a generated Application. A stage file or label that goes
    # missing, even for the seconds the repo cache needs after a push, would
    # otherwise delete every spoke's Application. Removing a spoke stays manual.
    applicationsSync: create-update
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  fleet_member: spoke
                # A spoke without these labels is skipped, instead of failing
                # generation for every spoke.
                matchExpressions:
                  - {key: stage, operator: Exists}
                  - {key: tenant, operator: Exists}
          - git:
              repoURL: '{{ .metadata.annotations.repo_url }}'
              revision: HEAD
              files:
                - path: 'tenants/{{ .metadata.labels.tenant }}/gitops-agents/{{ .metadata.labels.stage }}/values.yaml'
  template:
    metadata:
      name: '{{ .name }}-registration'
      labels:
        app.kubernetes.io/part-of: spoke-bootstrap
        spoke: '{{ .name }}'
        role: registration
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ .revision }}'
          ref: values
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ .revision }}'
          path: charts/fleet-member-registration
          helm:
            releaseName: '{{ .name }}'
            # defaults, then the stage file the generator found, then one
            # cluster's exceptions. Only the stage file must exist.
            ignoreMissingValueFiles: true
            valueFiles:
              - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/defaults/values.yaml'
              - '$values/{{ .path.path }}/{{ .path.filename }}'
              - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/clusters/{{ .name }}/values.yaml'
            # Enforced by the platform over the tenant files.
            valuesObject:
              spoke: false
              gitopsAgent:
                harnessAgent:
                  metadata:
                    name: '{{ .name }}'
                  spec:
                    name: '{{ .name }}'
                    # The BU's key is org-scoped. Scope and key are never the
                    # file's choice, and the agent never adopts another one.
                    scope: ORG
                    existingAgentIdentifier: ""
                    apiKeySecretRef: 'harness-api-key-{{ .metadata.labels.tenant }}'
                    tokenSecretRef: '{{ .name }}-agent-token'
                harness:
                  identity:
                    accountIdentifier: '{{ .metadata.annotations.harness_account_id }}'
                    orgIdentifier: '{{ .metadata.labels.tenant }}'
                    projectIdentifier: ""
                    agentIdentifier: '{{ .name | replace "-" "_" }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .name }}'
      syncPolicy:
        automated:
          selfHeal: true
          # Removing a spoke stays a deliberate act.
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 1m
