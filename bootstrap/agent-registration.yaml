# The hub half of an agent on every spoke: per spoke cluster Secret
# (fleet_member: spoke), one Application <spoke>-registration on the hub, in
# namespace <spoke>. It holds the ORG-scoped HarnessGitopsAgent, one project
# mapping per team and deny-all shadow AppProjects. The controller registers
# the agent and writes its token here; the token is then carried to the spoke
# (local/carry-token.sh <env> <spoke>-agent-token).
#
# The spoke half is bootstrap/spoke-bootstrap.yaml. Keep the identity values
# below equal in both files: the agent's name, identifier, org and token name.
#
# Values: tenants/<business_unit>/<environment>/spokes.yaml (the BU's teams;
# its revision key pins charts and values for that group), then the valuesObject
# below, which the file cannot override. Agent identity is immutable, so never
# rename a spoke's cluster Secret.
#
# No metadata.namespace: the root Application applies this into the hub
# agent's namespace. A selector or path that matches nothing still reports
# success, so check with `kubectl get applications`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: agent-registration
spec:
  goTemplate: true
  # Templates read cluster metadata and paths, plus the spokes file's revision.
  # If revision is missing, generation stops for every spoke, and the existing
  # Applications keep their last revision.
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting an Application never deletes the agent object, whose finalizer
    # would deregister the agent in Harness.
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  fleet_member: spoke
                # A spoke without these labels is skipped, instead of failing
                # generation for every spoke.
                matchExpressions:
                  - {key: environment, operator: Exists}
                  - {key: business_unit, operator: Exists}
          - git:
              repoURL: '{{ .metadata.annotations.repo_url }}'
              revision: HEAD
              files:
                - path: 'tenants/{{ .metadata.labels.business_unit }}/{{ .metadata.labels.environment }}/spokes.yaml'
  template:
    metadata:
      name: '{{ .name }}-registration'
      labels:
        app.kubernetes.io/part-of: spoke-bootstrap
        spoke: '{{ .name }}'
        role: registration
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ .revision }}'
          ref: values
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ .revision }}'
          path: charts/agent-registration
          helm:
            releaseName: '{{ .name }}'
            valueFiles:
              - '$values/{{ .path.path }}/{{ .path.filename }}'
            # Enforced by the platform over the spokes file.
            valuesObject:
              spoke: false
              gitopsAgent:
                harnessAgent:
                  metadata:
                    name: '{{ .name }}'
                  spec:
                    name: '{{ .name }}'
                    # The BU's key is org-scoped. Scope and key are never the
                    # file's choice, and the agent never adopts another one.
                    scope: ORG
                    existingAgentIdentifier: ""
                    apiKeySecretRef: 'harness-api-key-{{ .metadata.labels.business_unit }}'
                    tokenSecretRef: '{{ .name }}-agent-token'
                harness:
                  identity:
                    accountIdentifier: '{{ .metadata.annotations.harness_account_id }}'
                    orgIdentifier: '{{ .metadata.labels.business_unit }}'
                    projectIdentifier: ""
                    agentIdentifier: '{{ .name | replace "-" "_" }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .name }}'
      syncPolicy:
        automated:
          selfHeal: true
          # Removing a spoke stays a deliberate act.
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 1m
