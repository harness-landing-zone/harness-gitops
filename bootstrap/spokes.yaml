# Applies everything that bootstraps the spokes, kept apart in
# spoke-bootstrap/ (as GitOps Bridge and EKS Fleet Management keep their
# add-on ApplicationSets in a folder of their own). For the hub cluster
# Secret (fleet_member: hub-cluster) it makes one Application <hub>-spokes on
# the hub, which applies every ApplicationSet in spoke-bootstrap/ into the hub
# agent's namespace. Those ApplicationSets then make the Applications for
# every spoke.
#
# bootstrap/ keeps what the hub itself needs (its add-ons, cluster
# registration, the hub half of the agents); spoke-bootstrap/ keeps what is
# installed on the spokes.
#
# No metadata.namespace: the root Application applies this into the hub
# agent's namespace. Never name this ApplicationSet spoke-bootstrap: that name
# is the earlier ApplicationSet that still owns the spokes' Applications.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spokes
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting the Application leaves the spoke ApplicationSets running.
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: hub-cluster
  template:
    metadata:
      name: '{{ .name }}-spokes'
      labels:
        app.kubernetes.io/part-of: spoke-bootstrap
    spec:
      project: default
      source:
        repoURL: '{{ .metadata.annotations.repo_url }}'
        targetRevision: HEAD
        path: spoke-bootstrap
        directory:
          recurse: false
      destination:
        name: '{{ .name }}'
        namespace: hga-hub-agent
      syncPolicy:
        automated:
          selfHeal: true
          # A file removed from spoke-bootstrap/ leaves its ApplicationSet,
          # and with it every spoke's Applications, in place.
          prune: false
        retry:
          limit: 20
          backoff:
            duration: 1m
