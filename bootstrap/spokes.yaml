# Installs the ApplicationSets that register and bootstrap the spokes, as EKS
# Fleet Management's bootstrap files install its application-sets chart. For
# the hub cluster Secret (fleet_member: hub-cluster) it makes one Application
# <hub>-spokes on the hub: charts/application-sets with the entries in
# spoke-bootstrap/values.yaml (cluster-registration, agent-registration,
# spoke-controller, spoke-runtime, spoke-teams), applied into the hub agent's
# namespace. Those ApplicationSets then make the Applications for every
# cluster.
#
# One revision for all of it: the hub cluster Secret's annotation
# repo_revision (a branch, tag or commit), HEAD when it is missing. It applies
# to this Application, the chart, and every source and member-file generator
# the ApplicationSets render.
#
# bootstrap/ keeps what the root Application applies directly (the hub's
# add-ons and this file); spoke-bootstrap/ keeps the ApplicationSet entries.
#
# No metadata.namespace: the root Application applies this into the hub
# agent's namespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spokes
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting the Application leaves the ApplicationSets running.
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: hub-cluster
  template:
    metadata:
      name: '{{ .name }}-spokes'
      labels:
        app.kubernetes.io/part-of: spoke-bootstrap
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ default "HEAD" (index .metadata.annotations "repo_revision") }}'
          ref: values
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ default "HEAD" (index .metadata.annotations "repo_revision") }}'
          path: charts/application-sets
          helm:
            releaseName: spokes
            valueFiles:
              - $values/spoke-bootstrap/values.yaml
            valuesObject:
              revision: '{{ default "HEAD" (index .metadata.annotations "repo_revision") }}'
      destination:
        name: '{{ .name }}'
        namespace: hga-hub-agent
      syncPolicy:
        automated:
          selfHeal: true
          # An entry removed from spoke-bootstrap/values.yaml leaves its
          # ApplicationSet, and with it every cluster's Applications, in place.
          prune: false
        retry:
          limit: 20
          backoff:
            duration: 1m
