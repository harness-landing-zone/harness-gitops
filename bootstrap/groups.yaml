# Installs every group of ApplicationSets, as EKS Fleet Management installs
# its application-sets chart once per add-on group. A group is a file in
# groups/; committing one adds a group. For the hub cluster Secret
# (fleet_member: hub-cluster) and each group file this makes one Application
# <hub>-<group> on the hub: charts/application-sets with that file, applied
# into the hub agent's namespace. Its ApplicationSets then make the
# Applications for every cluster.
#
# Groups today: addons (the hub's own add-ons), fleet (cluster registration),
# agents (the agent on every spoke and its hub-side registration).
#
# One revision for all of it: the hub cluster Secret's annotation
# repo_revision (a branch, tag or commit), HEAD when it is missing. It applies
# to the group files, these Applications, the chart, and every source and git
# generator the ApplicationSets render.
#
# Removing a group file deletes nothing: its Application, ApplicationSets and
# their Applications stay (create-update, no prune).
#
# No metadata.namespace: the root Application applies this into the hub
# agent's namespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: groups
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting an Application leaves its ApplicationSets running.
    preserveResourcesOnDeletion: true
    # Never delete a generated Application.
    applicationsSync: create-update
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  fleet_member: hub-cluster
          - git:
              repoURL: '{{ .metadata.annotations.repo_url }}'
              revision: '{{ default "HEAD" (index .metadata.annotations "repo_revision") }}'
              files:
                - path: groups/*.yaml
  template:
    metadata:
      name: '{{ .name }}-{{ trimSuffix ".yaml" .path.filename }}'
      labels:
        group: '{{ trimSuffix ".yaml" .path.filename }}'
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ default "HEAD" (index .metadata.annotations "repo_revision") }}'
          ref: values
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ default "HEAD" (index .metadata.annotations "repo_revision") }}'
          path: charts/application-sets
          helm:
            releaseName: '{{ trimSuffix ".yaml" .path.filename }}'
            valueFiles:
              - '$values/{{ .path.path }}/{{ .path.filename }}'
            valuesObject:
              group: '{{ trimSuffix ".yaml" .path.filename }}'
              revision: '{{ default "HEAD" (index .metadata.annotations "repo_revision") }}'
      destination:
        name: '{{ .name }}'
        namespace: hga-hub-agent
      syncPolicy:
        automated:
          selfHeal: true
          # An entry removed from a group file leaves its ApplicationSet, and
          # with it every cluster's Applications, in place.
          prune: false
        retry:
          limit: 20
          backoff:
            duration: 1m
