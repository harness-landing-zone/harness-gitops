# Registers every fleet member, as EKS Fleet Management does. A cluster is a
# member because fleet-members/<cluster>.yaml exists. The file name is the
# Argo CD cluster name and the cluster Secret name; the file says how the
# cluster is bootstrapped (tenant, stage, gitopsAgent, agentModel).
#
# For each file this makes Application <cluster>-cluster on the hub
# (charts/cluster-registration). ESO then creates that cluster Secret in
# hga-hub-agent from OpenBao clusters/<cluster>. Only the connection (server,
# CA, token) is in the store; the labels (tenant, stage, fleet_member) come
# from git. The spoke-* ApplicationSets select on those labels.
#
# Removing a member file deletes nothing (no prune). Deleting the
# ExternalSecret deletes the cluster Secret (creationPolicy Owner), so never
# delete it by hand for a live spoke.
#
# No metadata.namespace: the root Application applies this into the hub
# agent's namespace. A generator that matches nothing still reports success,
# so check with `kubectl get applications`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-registration
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting an Application never deletes the ExternalSecret and with it the
    # cluster Secret.
    preserveResourcesOnDeletion: true
    # Never delete a generated Application. Removing a cluster stays manual.
    applicationsSync: create-update
  generators:
    - matrix:
        generators:
          # The hub's own cluster Secret: repo_url and harness_account_id.
          - clusters:
              selector:
                matchLabels:
                  fleet_member: hub-cluster
          # One entry per member file.
          - git:
              repoURL: '{{ .metadata.annotations.repo_url }}'
              revision: HEAD
              files:
                - path: fleet-members/*.yaml
  template:
    metadata:
      name: '{{ trimSuffix ".yaml" .path.filename }}-cluster'
      labels:
        app.kubernetes.io/part-of: cluster-registration
        cluster: '{{ trimSuffix ".yaml" .path.filename }}'
        # From the member file; "" when a file leaves them out.
        tenant: '{{ default "" (index . "tenant") }}'
        stage: '{{ default "" (index . "stage") }}'
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: HEAD
          ref: values
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: HEAD
          path: charts/cluster-registration
          helm:
            releaseName: '{{ trimSuffix ".yaml" .path.filename }}'
            valueFiles:
              - '$values/{{ .path.path }}/{{ .path.filename }}'
            # Enforced over the member file. The cluster's name is the file
            # name; the tenant is the file's own (the chart validates it).
            valuesObject:
              clusterName: '{{ trimSuffix ".yaml" .path.filename }}'
              # Every member: only its ExternalSecret. The store is
              # installed once, by the hub's openbao Application.
              secretStore:
                enabled: false
                name: hub-openbao
              externalSecret:
                enabled: true
              annotations:
                repo_url: '{{ .metadata.annotations.repo_url }}'
                harness_account_id: '{{ .metadata.annotations.harness_account_id }}'
      destination:
        name: '{{ .name }}'
        namespace: hga-hub-agent
      syncPolicy:
        automated:
          selfHeal: true
          # Removing a cluster stays a deliberate act.
          prune: false
        retry:
          limit: 20
          backoff:
            duration: 1m
