# Installs OpenBao on the hub itself, in dev mode, from the upstream chart
# (pinned), plus the one ClusterSecretStore through which ESO reads it. One
# Application per hub cluster Secret: hub-cluster-openbao, namespace openbao.
#
# Dev mode is for the k3d proof only: one pod, in memory, no unsealing. Every
# restart empties the store, so every spoke's entry must be written again
# (local/k3d.sh register). Cluster Secrets already made from it stay in place
# meanwhile.
#
# The store holds only cluster connections: clusters/<cluster> with keys
# server, caData and token. Harness API keys never enter it.
#
# Selected on fleet_member: hub-cluster alone, as hub-external-secrets is. The
# store objects need ESO's CRDs from hub-external-secrets; until they exist,
# that part of the sync retries.
#
# Values: addons/hub/defaults/openbao/values.yaml, then the optional
# addons/hub/environments/<environment>/openbao/values.yaml. The
# ClusterSecretStore hub-openbao and its dev token Secret come from
# charts/cluster-registration (release openbao-store, store on), as Fleet
# Management's fleet-secret chart carries its store.
#
# No metadata.namespace: the root Application applies this into the hub
# agent's namespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-openbao
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting the Application leaves OpenBao and the store running.
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: hub-cluster
  template:
    metadata:
      name: '{{ .name }}-openbao'
      labels:
        app.kubernetes.io/part-of: hub-addons
    spec:
      project: default
      destination:
        name: '{{ .name }}'
        namespace: openbao
      sources:
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: HEAD
          ref: values
        - repoURL: https://openbao.github.io/openbao-helm
          chart: openbao
          targetRevision: 0.30.7
          helm:
            releaseName: openbao
            ignoreMissingValueFiles: true
            valueFiles:
              - '$values/addons/hub/defaults/openbao/values.yaml'
              - '$values/addons/hub/environments/{{ .metadata.labels.environment }}/openbao/values.yaml'
        # The ClusterSecretStore and its dev token Secret, from the
        # registration chart (store on, no member ExternalSecret).
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: HEAD
          path: charts/cluster-registration
          helm:
            releaseName: openbao-store
            valuesObject:
              secretStore:
                enabled: true
              externalSecret:
                enabled: false
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 1m
