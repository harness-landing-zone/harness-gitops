# One org shard per environments/<environment>/orgs/<name>/values.yaml.
#
# Each file becomes, in namespace <name> on the hub cluster, a NAMESPACED Argo
# CD with an ORG-scoped Harness GitOps Agent and one project mapping per
# Harness project (bootstrap chart). charts/org-platform adds the org's
# workload namespaces, the Roles that let that Argo CD deploy only there, a
# restricted cluster entry and the AppProject fence. Both charts read the same
# file; the platform-enforced values below win over it.
#
# The hub cluster Secret chooses the environment folder, so this file is
# identical on every hub. <name> is the folder name and becomes the namespace,
# the Helm release and the Application suffix. Never rename a folder: the Argo
# CD subchart bakes the release name into immutable Deployment selectors.
#
# No metadata.namespace on purpose: the root Application applies this into the
# hub agent's own namespace, which is where its ApplicationSet controller looks.
#
# Before an org's agent can register, its namespace must be listed in
# hub/controller.yaml and hold the Secret harness-api-key-secret (key api_key).
#
# A selector or path that matches nothing still reports success. Check with
# `kubectl get applications`, not with this ApplicationSet's status.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: orgs
spec:
  goTemplate: true
  # Safe here because the template reads only cluster metadata and the file
  # path, never keys from inside a values file. A hub Secret missing a label
  # fails loudly instead of rendering "<no value>".
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  fleet_member: hub-cluster
          - git:
              repoURL: '{{.metadata.annotations.repo_url}}'
              revision: HEAD
              files:
                - path: 'environments/{{.metadata.labels.environment}}/orgs/*/values.yaml'
  template:
    metadata:
      name: 'org-{{.path.basename}}'
      labels:
        app.kubernetes.io/part-of: harness-gitops-orgs
        harness.io/envRef: '{{.metadata.labels.harness_env_ref}}'
    spec:
      project: default
      destination:
        name: '{{.name}}'
        namespace: '{{.path.basename}}'
      sources:
        # Argo CD, the ORG agent and its project mappings.
        - repoURL: '{{.metadata.annotations.repo_url}}'
          targetRevision: HEAD
          path: charts/harness-gitops-agent-bootstrap
          helm:
            releaseName: '{{.path.basename}}'
            # A leading slash is relative to the repo root.
            valueFiles:
              - '/{{.path.path}}/values.yaml'
            # Enforced by the platform over the org file.
            valuesObject:
              gitopsAgent:
                harness:
                  identity:
                    accountIdentifier: '{{.metadata.annotations.harness_account_id}}'
                  # Namespaced install: no ClusterRoles. org-platform grants
                  # Roles in the org's workload namespaces instead.
                  createClusterRoles: false
                argo-cd:
                  # The hub owns the cluster-scoped Argo CD CRDs.
                  crds:
                    install: false
                  configs:
                    cm:
                      # Only the restricted cluster Secret from org-platform
                      # may be a destination.
                      cluster.inClusterEnabled: "false"
              # Both are Helm hooks in this chart, which Argo CD deletes and
              # recreates on every sync. org-platform renders the org's
              # projects as ordinary resources instead.
              appProject:
                enabled: false
              rootAppSet:
                enabled: false
              # org-platform owns the one cluster Secret for this server URL.
              hubCluster:
                enabled: false
        # Workload namespaces, Roles, restricted cluster entry, AppProjects.
        - repoURL: '{{.metadata.annotations.repo_url}}'
          targetRevision: HEAD
          path: charts/org-platform
          helm:
            releaseName: '{{.path.basename}}-platform'
            valueFiles:
              - '/{{.path.path}}/values.yaml'
            valuesObject:
              # Same metadata the hub cluster Secret carries.
              clusterLabels:
                environment: '{{.metadata.labels.environment}}'
                harness_env_ref: '{{.metadata.labels.harness_env_ref}}'
      syncPolicy:
        automated:
          selfHeal: true
          # Removing an org stays a deliberate act.
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 1m
