# The spoke half of an agent on every spoke: per spoke cluster Secret
# (fleet_member: spoke), one Application <spoke>-runtime on that spoke, in
# namespace <spoke>. It holds a cluster-wide Argo CD with its CRDs, the agent,
# and the team Namespaces and AppProjects. The namespace matches the hub side,
# because the controller registers the agent with its object's namespace.
#
# The hub half, which registers the agent and receives its token, is
# bootstrap/agent-registration.yaml. Keep the identity values below equal in
# both files. Until the token is carried
# (local/carry-token.sh <env> <spoke>-agent-token), the agent pod waits
# (CreateContainerConfigError) and then starts on its own.
#
# Values, lowest first: tenants/<tenant>/gitops-agents/defaults/values.yaml,
# <stage>/values.yaml (required; its revision is the upgrade group: bump
# nonprod first, then prod), clusters/<spoke>/values.yaml (optional), then the
# valuesObject below, which no tenant file can override.
#
# No metadata.namespace: the root Application applies this into the hub
# agent's namespace. A selector or path that matches nothing still reports
# success, so check with `kubectl get applications`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-runtime
spec:
  goTemplate: true
  # Templates read cluster metadata and paths, plus the stage file's revision.
  # If revision is missing, generation stops for every spoke, and the existing
  # Applications keep their last revision.
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
    # Never delete a generated Application. A stage file or label that goes
    # missing, even for the seconds the repo cache needs after a push, would
    # otherwise delete every spoke's Application. Removing a spoke stays manual.
    applicationsSync: create-update
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  fleet_member: spoke
                # A spoke without these labels is skipped, instead of failing
                # generation for every spoke.
                matchExpressions:
                  - {key: stage, operator: Exists}
                  - {key: tenant, operator: Exists}
          - git:
              repoURL: '{{ .metadata.annotations.repo_url }}'
              revision: HEAD
              files:
                - path: 'tenants/{{ .metadata.labels.tenant }}/gitops-agents/{{ .metadata.labels.stage }}/values.yaml'
  template:
    metadata:
      name: '{{ .name }}-runtime'
      labels:
        app.kubernetes.io/part-of: spoke-bootstrap
        spoke: '{{ .name }}'
        role: runtime
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ .revision }}'
          ref: values
        # Argo CD and the agent runtime. Its agent object lives on the hub.
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ .revision }}'
          path: charts/gitops-agent
          helm:
            # Never change: the argo-cd subchart bakes it into immutable
            # selectors.
            releaseName: hga-agent
            # defaults, then the stage file the generator found, then one
            # cluster's exceptions. Only the stage file must exist.
            ignoreMissingValueFiles: true
            valueFiles:
              - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/defaults/values.yaml'
              - '$values/{{ .path.path }}/{{ .path.filename }}'
              - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/clusters/{{ .name }}/values.yaml'
            valuesObject:
              gitopsAgent:
                # Registration happens on the hub, so the spoke has no agent
                # object, no mappings and nothing that needs a key.
                harnessAgent:
                  enabled: false
                # A real empty list: gitops-helm fails if mappings exist while
                # the agent object is off, and a null breaks its len check.
                projectMappings: []
                # Needs the CRDs at render time; the second chart below renders
                # the AppProjects instead.
                appProject:
                  enabled: false
                harness:
                  identity:
                    accountIdentifier: '{{ .metadata.annotations.harness_account_id }}'
                    orgIdentifier: '{{ .metadata.labels.tenant }}'
                    projectIdentifier: ""
                    agentIdentifier: '{{ .name | replace "-" "_" }}'
                agent:
                  harnessName: '{{ .name }}'
                  existingSecrets:
                    # The Secret the token is carried into. Never let the chart
                    # create it: an empty token fails for the wrong reason.
                    agentToken: '{{ .name }}-agent-token'
                argo-cd:
                  # Arbitrary objects and extra cluster Secrets from a tenant
                  # file would bypass the AppProjects.
                  extraObjects: []
                  configs:
                    clusterCredentials: null
              apiKeySecret:
                create: false
              gitSecret:
                create: false
              rootAppSet:
                enabled: false
              hubCluster:
                enabled: false
        # The team Namespaces, the real team AppProjects and a locked default.
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ .revision }}'
          path: charts/fleet-member-registration
          helm:
            releaseName: hga-agent-projects
            # defaults, then the stage file the generator found, then one
            # cluster's exceptions. Only the stage file must exist.
            ignoreMissingValueFiles: true
            valueFiles:
              - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/defaults/values.yaml'
              - '$values/{{ .path.path }}/{{ .path.filename }}'
              - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/clusters/{{ .name }}/values.yaml'
            valuesObject:
              spoke: true
      destination:
        name: '{{ .name }}'
        namespace: '{{ .name }}'
      syncPolicy:
        automated:
          selfHeal: true
          # Removing a spoke stays a deliberate act.
          prune: false
        syncOptions:
          - CreateNamespace=true
          # The Argo CD CRDs exceed the client-side annotation limit.
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 1m
