# An agent on every spoke, with the controller and every key kept on the hub.
#
# Each spoke cluster Secret on the hub (fleet_member: spoke) gets two
# Applications:
#   <spoke>-registration  on the hub, namespace <spoke>: the ORG-scoped
#                         HarnessGitopsAgent, one project mapping per team and
#                         the deny-all shadow AppProjects the mapping
#                         reconciler checks. The controller writes the agent
#                         token here.
#   <spoke>-runtime       on the spoke, namespace <spoke>: a cluster-wide Argo
#                         CD and the agent, which waits for that token, plus
#                         the real team AppProjects.
# Both sides use the same namespace on purpose: the controller registers the
# agent with its object's namespace, so the runtime must run in a namespace of
# that name.
# The token is carried from the hub to the spoke out of band (a local script
# for now, local/carry-token.sh <env> <spoke>-agent-token). Until then the
# agent pod waits (CreateContainerConfigError) and starts on its own once the
# Secret appears.
#
# A spoke's values are tenants/<business_unit label>/<environment label>/
# spokes.yaml. Its revision key is the upgrade group: everything these spokes
# run comes from that revision. Bump nonprod first, then prod. No RollingSync:
# it needs progressive syncs, which the hub does not enable, and without them
# the strategy is silently ignored.
#
# The platform enforces the identity below, from the cluster Secret name and
# the business_unit label. Agent identity is immutable, so never rename a
# spoke's cluster Secret.
#
# No metadata.namespace: the root Application applies this into the hub
# agent's namespace. A selector or path that matches nothing still reports
# success, so check with `kubectl get applications`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-bootstrap
spec:
  goTemplate: true
  # Templates read cluster metadata and paths, plus one exception: the
  # revision key. If it is missing, generation fails for every spoke, and the
  # existing Applications keep their last revision. That is safer than
  # silently unpinning.
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        fleet_member: spoke
                      # The template needs both labels. A spoke without them is
                      # skipped, instead of failing generation for every spoke.
                      matchExpressions:
                        - {key: environment, operator: Exists}
                        - {key: business_unit, operator: Exists}
                # A spoke whose business unit and environment have no file gets
                # nothing.
                - git:
                    repoURL: '{{.metadata.annotations.repo_url}}'
                    revision: HEAD
                    files:
                      - path: 'tenants/{{.metadata.labels.business_unit}}/{{.metadata.labels.environment}}/spokes.yaml'
          - list:
              elements:
                - role: registration
                - role: runtime
  template:
    metadata:
      name: '{{.name}}-{{.role}}'
      labels:
        app.kubernetes.io/part-of: spoke-bootstrap
        spoke: '{{.name}}'
        role: '{{.role}}'
    spec:
      project: default
      # Left empty and filled in per role by templatePatch. The patch is merged
      # into this, so a server here would end up next to the runtime's name,
      # which Argo rejects.
      destination: {}
      syncPolicy:
        automated:
          selfHeal: true
          # Removing a spoke stays a deliberate act.
          prune: false
        syncOptions:
          - CreateNamespace=true
          # The Argo CD CRDs exceed the client-side annotation limit.
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 1m
  templatePatch: |
    spec:
      sources:
        - repoURL: '{{.metadata.annotations.repo_url}}'
          targetRevision: '{{.revision}}'
          ref: values
    {{- if eq .role "registration" }}
        - repoURL: '{{.metadata.annotations.repo_url}}'
          targetRevision: '{{.revision}}'
          path: charts/agent-registration
          helm:
            releaseName: '{{.name}}'
            valueFiles:
              - '$values/{{.path.path}}/{{.path.filename}}'
            # Enforced by the platform over the spokes file.
            valuesObject:
              spoke: false
              gitopsAgent:
                harnessAgent:
                  metadata:
                    name: '{{.name}}'
                  spec:
                    name: '{{.name}}'
                    # The BU's key is org-scoped. Scope and key are never the
                    # file's choice, and the agent never adopts another one.
                    scope: ORG
                    existingAgentIdentifier: ""
                    apiKeySecretRef: 'harness-api-key-{{.metadata.labels.business_unit}}'
                    tokenSecretRef: '{{.name}}-agent-token'
                harness:
                  identity:
                    accountIdentifier: '{{.metadata.annotations.harness_account_id}}'
                    orgIdentifier: '{{.metadata.labels.business_unit}}'
                    projectIdentifier: ""
                    agentIdentifier: '{{.name | replace "-" "_"}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.name}}'
    {{- else }}
        # Argo CD and the agent runtime. Its agent object lives on the hub.
        - repoURL: '{{.metadata.annotations.repo_url}}'
          targetRevision: '{{.revision}}'
          path: charts/gitops-agent
          helm:
            # Never change: the argo-cd subchart bakes it into immutable
            # selectors.
            releaseName: hga-agent
            valueFiles:
              - '$values/{{.path.path}}/{{.path.filename}}'
            valuesObject:
              gitopsAgent:
                # Registration happens on the hub, so the spoke has no agent
                # object, no mappings and nothing that needs a key.
                harnessAgent:
                  enabled: false
                # A real empty list: gitops-helm fails if mappings exist while
                # the agent object is off, and a null breaks its len check.
                projectMappings: []
                # Needs the CRDs at render time; agent-registration below
                # renders the AppProjects instead.
                appProject:
                  enabled: false
                harness:
                  identity:
                    accountIdentifier: '{{.metadata.annotations.harness_account_id}}'
                    orgIdentifier: '{{.metadata.labels.business_unit}}'
                    projectIdentifier: ""
                    agentIdentifier: '{{.name | replace "-" "_"}}'
                agent:
                  harnessName: '{{.name}}'
                  existingSecrets:
                    # The Secret the token is carried into. Never let the chart
                    # create it: an empty token fails for the wrong reason.
                    agentToken: '{{.name}}-agent-token'
                argo-cd:
                  # Arbitrary objects and extra cluster Secrets from a spokes
                  # file would bypass the AppProjects.
                  extraObjects: []
                  configs:
                    clusterCredentials: null
              apiKeySecret:
                create: false
              gitSecret:
                create: false
              rootAppSet:
                enabled: false
              hubCluster:
                enabled: false
        # The real team AppProjects (one per mapping) and a locked default.
        - repoURL: '{{.metadata.annotations.repo_url}}'
          targetRevision: '{{.revision}}'
          path: charts/agent-registration
          helm:
            releaseName: hga-agent-projects
            valueFiles:
              - '$values/{{.path.path}}/{{.path.filename}}'
            valuesObject:
              spoke: true
      destination:
        name: '{{.name}}'
        namespace: '{{.name}}'
    {{- end }}
