# Org GitOps Agents: one per fleet-registration/<agent>/agent.yaml. The folder
# is the agent's immutable name and its namespace (fleet-registration/bu1-dev/
# -> namespace bu1-dev, Harness agent bu1_dev in org <tenant>): upstream
# gitops-helm 1.3.0 (no ClusterRoles, no CRDs) + charts/agent-onboarding.
# Deleting an agent.yaml never deregisters a live agent (create-update, preserve).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleet-agents
  namespace: hga-hub-agent
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
    applicationsSync: create-update
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  fleet_member: hub-cluster
          - git:
              repoURL: '{{ .metadata.annotations.repo_url }}'
              revision: '{{ default "HEAD" (index .metadata.annotations "repo_revision") }}'
              files:
                - path: 'fleet-registration/*/agent.yaml'
  template:
    metadata:
      name: '{{ index .path.segments 1 }}'
      labels:
        agent: '{{ index .path.segments 1 }}'
        tenant: '{{ .tenant }}'
    spec:
      project: platform-admin
      destination:
        name: '{{ .name }}'
        namespace: '{{ index .path.segments 1 }}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        retry:
          limit: 100
          backoff:
            duration: 1m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      sources:
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ default "HEAD" (index .metadata.annotations "repo_revision") }}'
          ref: values
        # The agent: a namespaced Argo CD and Harness agent.
        - repoURL: https://harness.github.io/gitops-helm
          chart: gitops-helm
          targetRevision: 1.3.0
          helm:
            releaseName: '{{ index .path.segments 1 }}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/values/agents/gitops-helm/values.yaml
              - $values/tenants/{{ .tenant }}/values.yaml
              - $values/values/agents/gitops-helm/enforced.yaml
            parameters:
              - name: harness.gitopsServerHost
                value: '{{ default "https://app.harness.io/prod1/gitops" (index .metadata.annotations "gitops_server_host") }}'
                forceString: true
              - name: harness.configMap.http.agentHttpTarget
                value: '{{ default "https://app.harness.io/gitops" (index .metadata.annotations "agent_http_target") }}'
                forceString: true
              - name: harness.identity.accountIdentifier
                value: '{{ .metadata.annotations.harness_account_id }}'
                forceString: true
              - name: harness.identity.orgIdentifier
                value: '{{ .tenant }}'
                forceString: true
              - name: harness.identity.agentIdentifier
                value: '{{ index .path.segments 1 | replace "-" "_" }}'
                forceString: true
              - name: agent.harnessName
                value: '{{ index .path.segments 1 }}'
                forceString: true
              - name: agent.existingSecrets.agentToken
                value: '{{ index .path.segments 1 }}-token'
                forceString: true
        # PE-managed: HarnessGitopsAgent, project mappings, team AppProjects
        # plus a locked default, and the agent's own-namespace Role.
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ default "HEAD" (index .metadata.annotations "repo_revision") }}'
          path: charts/agent-onboarding
          helm:
            releaseName: '{{ index .path.segments 1 }}-onboarding'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/tenants/{{ .tenant }}/teams/*/values.yaml
              - $values/{{ .path.path }}/{{ .path.filename }}
            parameters:
              - name: agent.name
                value: '{{ index .path.segments 1 }}'
                forceString: true
              - name: agent.identifier
                value: '{{ index .path.segments 1 | replace "-" "_" }}'
                forceString: true
              - name: agent.accountId
                value: '{{ .metadata.annotations.harness_account_id }}'
                forceString: true
              - name: agent.apiKeySecretRef
                value: 'harness-api-key-{{ .tenant }}'
                forceString: true
              - name: agent.tokenSecretRef
                value: '{{ index .path.segments 1 }}-token'
                forceString: true
