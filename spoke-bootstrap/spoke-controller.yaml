# The controller of every self-managed spoke (controller, key and agent
# objects on the spoke). For every spoke cluster Secret without agent_model:
# hub it makes one Application <spoke>-controller on that spoke, in namespace
# hga-system: the controller and its CRDs. The key Secret
# harness-api-key-secret in hga-system never comes from git: the hub pushes it
# from OpenBao when the member file sets harnessSecretName
# (charts/cluster-registration), otherwise it is created by hand. The
# runtime's agent object (spoke-runtime.yaml) retries until this controller's
# CRDs exist.
#
# Siblings: spoke-runtime.yaml, spoke-teams.yaml and
# bootstrap/agent-registration.yaml (hub-managed: agent object and mappings on
# the hub).
#
# No metadata.namespace: <hub>-spokes (bootstrap/spokes.yaml) applies this
# into the hub agent's namespace. A selector that matches nothing still
# reports success, so check with `kubectl get applications`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-controller
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting an Application never deletes the controller or its CRDs
    # (deleting the CRDs would delete every agent object and mapping on the
    # spoke).
    preserveResourcesOnDeletion: true
    # Never delete a generated Application. Removing a spoke stays manual.
    applicationsSync: create-update
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: spoke
          # A spoke without these labels is skipped, instead of failing
          # generation for every spoke.
          matchExpressions:
            - {key: tenant, operator: Exists}
            - {key: stage, operator: Exists}
            # A missing label counts as not hub: a self-managed spoke needs no
            # agent_model label.
            - {key: agent_model, operator: NotIn, values: [hub]}
  template:
    metadata:
      name: '{{ .name }}-controller'
      labels:
        app.kubernetes.io/part-of: spoke-bootstrap
        cluster: '{{ .name }}'
        tenant: '{{ .metadata.labels.tenant }}'
        stage: '{{ .metadata.labels.stage }}'
        role: controller
    spec:
      project: default
      destination:
        name: '{{ .name }}'
        namespace: hga-system
      syncPolicy:
        automated:
          selfHeal: true
          # Removing a spoke stays a deliberate act.
          prune: false
        syncOptions:
          - CreateNamespace=true
          # The Argo CD CRDs exceed the client-side annotation limit.
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 1m
      sources:
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: HEAD
          path: charts/harness-gitops-agent-controller
          helm:
            releaseName: hga-controller
            namespace: hga-system
