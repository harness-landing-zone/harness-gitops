# The agent runtime on every spoke. For every spoke cluster Secret
# (fleet_member: spoke, with tenant and stage labels) it makes one Application
# <spoke>-runtime on that spoke, in namespace <spoke>, in sync waves:
#
#   wave 0  charts/gitops-agent: Argo CD with its CRDs, the agent's config.
#   wave 1  charts/fleet-member-registration: the HarnessGitopsAgent and a
#           locked default AppProject. (Hub model: only the locked default;
#           the agent object lives on the hub.)
#   wave 3  the agent Deployment. The controller writes <spoke>-agent-token
#           beside it; nothing carries a token between clusters.
#
# Values: tenants/<tenant>/gitops-agents/defaults/values.yaml, then
# <stage>/values.yaml.
#
# Siblings: spoke-teams.yaml (team namespaces, AppProjects,
# mappings), spoke-controller.yaml (v1 only: the controller on the
# spoke) and bootstrap/agent-registration.yaml (hub model: agent object and
# mappings on the hub).
#
# Identity comes from the cluster Secret: org <tenant>, ORG scope, identifier
# <spoke> with "_". It is immutable, so never rename a spoke's cluster Secret
# or change its tenant.
#
# No metadata.namespace: <hub>-spokes (bootstrap/spokes.yaml) applies this
# into the hub agent's namespace. A selector that matches nothing still
# reports success, so check with `kubectl get applications`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-runtime
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting an Application never deletes the agent object or a mapping,
    # whose finalizers would deregister them in Harness.
    preserveResourcesOnDeletion: true
    # Never delete a generated Application. Removing a spoke stays manual.
    applicationsSync: create-update
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: spoke
          # A spoke without these labels is skipped, instead of failing
          # generation for every spoke.
          matchExpressions:
            - {key: tenant, operator: Exists}
            - {key: stage, operator: Exists}
  template:
    metadata:
      name: '{{ .name }}-runtime'
      labels:
        app.kubernetes.io/part-of: spoke-bootstrap
        cluster: '{{ .name }}'
        tenant: '{{ .metadata.labels.tenant }}'
        stage: '{{ .metadata.labels.stage }}'
        role: runtime
    spec:
      project: default
      destination:
        name: '{{ .name }}'
        namespace: '{{ .name }}'
      syncPolicy:
        automated:
          selfHeal: true
          # Removing a spoke stays a deliberate act.
          prune: false
        syncOptions:
          - CreateNamespace=true
          # The Argo CD CRDs exceed the client-side annotation limit.
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 1m
      sources:
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: HEAD
          ref: values
        # Wave 0: Argo CD and the agent runtime; the agent Deployment is wave 3.
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: HEAD
          path: charts/gitops-agent
          helm:
            # Never change: the argo-cd subchart bakes it into immutable
            # selectors.
            releaseName: hga-agent
            ignoreMissingValueFiles: true
            valueFiles:
              - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/defaults/values.yaml'
              - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/{{ .metadata.labels.stage }}/values.yaml'
            valuesObject:
              gitopsAgent:
                # The agent object and mappings come from the third chart.
                harnessAgent:
                  enabled: false
                # A real empty list: gitops-helm fails if mappings exist while
                # the agent object is off, and a null breaks its len check.
                projectMappings: []
                # Needs the CRDs at render time; the third chart renders the
                # AppProjects instead.
                appProject:
                  enabled: false
                harness:
                  identity:
                    accountIdentifier: '{{ .metadata.annotations.harness_account_id }}'
                    orgIdentifier: '{{ .metadata.labels.tenant }}'
                    projectIdentifier: ""
                    agentIdentifier: '{{ .name | replace "-" "_" }}'
                agent:
                  harnessName: '{{ .name }}'
                  existingSecrets:
                    # Written by the controller. Never let the chart create it:
                    # an empty token fails for the wrong reason.
                    agentToken: '{{ .name }}-agent-token'
                  # Last: it is Healthy only once the controller has written
                  # its token, and must not hold back the other waves.
                  deploymentAnnotations:
                    argocd.argoproj.io/sync-wave: "3"
                argo-cd:
                  # Arbitrary objects and extra cluster Secrets from a tenant
                  # file would bypass the AppProjects.
                  extraObjects: []
                  configs:
                    clusterCredentials: null
              apiKeySecret:
                create: false
              gitSecret:
                create: false
              rootAppSet:
                enabled: false
              hubCluster:
                enabled: false
        # Wave 1: the agent object and the locked default AppProject.
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: HEAD
          path: charts/fleet-member-registration
          helm:
            releaseName: '{{ .name }}'
            # The stage file is optional.
            ignoreMissingValueFiles: true
            valueFiles:
              - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/defaults/values.yaml'
              - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/{{ .metadata.labels.stage }}/values.yaml'
            # Enforced over the tenant files. Keep equal to the runtime's
            # identity above.
            valuesObject:
              # all = v1: agent object and locked default here; spoke = hub
              # model: only the locked default.
              target: '{{ if eq (index .metadata.labels "agent_model") "hub" }}spoke{{ else }}all{{ end }}'
              gitopsAgent:
                harnessAgent:
                  metadata:
                    name: '{{ .name }}'
                  spec:
                    name: '{{ .name }}'
                    # Scope, kind and key are never a tenant file's choice, and
                    # the agent never adopts another one.
                    scope: ORG
                    operator: ARGO
                    type: MANAGED_ARGO_PROVIDER
                    existingAgentIdentifier: ""
                    apiKeySecretRef: harness-api-key-secret
                    tokenSecretRef: '{{ .name }}-agent-token'
                agent:
                  existingSecrets:
                    agentToken: '{{ .name }}-agent-token'
                harness:
                  identity:
                    accountIdentifier: '{{ .metadata.annotations.harness_account_id }}'
                    orgIdentifier: '{{ .metadata.labels.tenant }}'
                    projectIdentifier: ""
                    agentIdentifier: '{{ .name | replace "-" "_" }}'
