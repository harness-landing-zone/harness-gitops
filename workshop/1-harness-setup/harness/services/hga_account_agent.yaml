service:
  name: HGA Account Agent
  identifier: hga_account_agent
  orgIdentifier: gitops_reference
  projectIdentifier: gitops_admin
  description: Installs the ACCOUNT-scoped hub agent with Native Helm. Agent identity is derived from the environment identifier.
  tags:
    purpose: platform-cd
  serviceDefinition:
    type: NativeHelm
    spec:
      manifests:
        - manifest:
            identifier: agent_bootstrap_chart
            type: HelmChart
            spec:
              store:
                type: Github
                spec:
                  connectorRef: hga_github
                  gitFetchType: Branch
                  folderPath: charts/gitops-agent
                  repoName: harness-gitops
                  branch: <+pipeline.variables.git_ref>
              valuesPaths:
                - hub/account-agent.yaml
              skipResourceVersioning: false
              helmVersion: V3
      variables:
        - name: agent_scope
          type: String
          description: Harness agent scope. ACCOUNT omits org and project identifiers.
          value: ACCOUNT
        - name: agent_identifier
          type: String
          description: Harness agent identifier (underscores allowed).
          value: hga_<+env.identifier>_hub
        - name: agent_name
          type: String
          description: DNS-safe agent and resource name; unique per cluster.
          value: hga-<+env.identifier>-hub
        - name: token_secret
          type: String
          description: Agent token Secret; must match the chart's existingSecrets.agentToken.
          value: hga-<+env.identifier>-hub-token
        - name: repo_url
          type: String
          description: Git URL of this repo, registered in Argo CD and stamped on the hub cluster Secret.
          value: https://github.com/harness-landing-zone/harness-gitops.git
  gitOpsEnabled: false
