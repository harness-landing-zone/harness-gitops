service:
  name: HGA Controller
  identifier: hga_controller
  orgIdentifier: gitops_reference
  projectIdentifier: gitops_admin
  description: Installs the HGA controller with Native Helm. The branch and image tag are pipeline inputs.
  tags:
    purpose: platform-cd
  serviceDefinition:
    type: NativeHelm
    spec:
      manifests:
        - manifest:
            identifier: controller_chart
            type: HelmChart
            spec:
              store:
                type: Github
                spec:
                  connectorRef: hga_github
                  gitFetchType: Branch
                  folderPath: charts/harness-gitops-agent-controller
                  repoName: harness-gitops
                  branch: <+pipeline.variables.git_ref>
              valuesPaths:
                - hub/controller.yaml
              skipResourceVersioning: false
              helmVersion: V3
  gitOpsEnabled: false
