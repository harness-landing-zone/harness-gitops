environment:
  name: Test
  identifier: test
  orgIdentifier: gitops_reference
  projectIdentifier: gitops_admin
  description: Test hub. The identifier selects environments/test/ and names the hub agent.
  type: PreProduction
  variables:
    - name: delegate_selector
      type: String
      description: Delegate inside this hub cluster, where the verify step runs. OpenTofu sets it from hub_delegate_name, the delegate the Kubernetes connector selects.
      value: hga-test-hub
