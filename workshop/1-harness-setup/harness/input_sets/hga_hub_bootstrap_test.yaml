inputSet:
  name: HGA Hub Bootstrap test
  identifier: hga_hub_bootstrap_test
  orgIdentifier: gitops_reference
  projectIdentifier: gitops_admin
  description: Every run-time input of hga_hub_bootstrap for environment test, so a run needs no form.
  tags:
    purpose: platform-cd
  pipeline:
    identifier: hga_hub_bootstrap
    variables:
      - name: git_ref
        type: String
        value: main
      - name: image_tag
        type: String
        value: v0.1.0
      - name: deploy_agent
        type: String
        value: "true"
    stages:
      - stage:
          identifier: deploy_controller
          type: Deployment
          spec:
            environment:
              environmentRef: test
              infrastructureDefinitions:
                - identifier: hga_system
      - stage:
          identifier: deploy_account_agent
          type: Deployment
          spec:
            environment:
              environmentRef: test
              infrastructureDefinitions:
                - identifier: account_agent
