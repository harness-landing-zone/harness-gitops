# A spoke that runs its own controller: workspace spoke-test, k3d cluster
# hga-spoke-test, its own Harness key in OpenBao.
role: spoke
# The BU's Harness org. Its role hga_controller_<bu> comes from
# ../1-harness-setup.
bu: bu1
# Where the key is written in OpenBao (on EKS: the Secrets Manager secret
# name). Under harness-api-keys/; default harness-api-keys/<workspace>. Put the
# same value in fleet-members/spoke-test.yaml as harnessSecretName, so the hub
# pushes it to the spoke.
harnessSecretName: harness-api-keys/spoke-test
