# Group agents: the GitOps agent and controller of every spoke. Installed
# by the hub's root ApplicationSet groups as Application <hub>-agents, with
# charts/application-sets. Every Application it generates gets the label
# group: agents.
#
# Harness indexes an Application's labels only when it is created, and
# renaming an Application creates a new one beside the old. Change a name or a
# label only together with a handover.
#
# An ApplicationSet whose generator matches nothing still reports success, so
# check with `kubectl get applications`.
labels:
  app.kubernetes.io/part-of: spoke-bootstrap
  cluster: '{{ .name }}'
  tenant: '{{ .metadata.labels.tenant }}'
  stage: '{{ .metadata.labels.stage }}'

applicationSets:

  # Each spoke gets <spoke>-controller in hga-system with the
  # controller and its CRDs. The hub pushes harness-api-key-secret from
  # OpenBao when the member file sets harnessSecretName. The key can also be
  # created by hand. The runtime's agent object waits for these CRDs.
  spoke-controller:
    selector:
      matchLabels:
        fleet_member: spoke
      matchExpressions:
        - {key: tenant, operator: Exists}
        - {key: stage, operator: Exists}
    name: '{{ .name }}-controller'
    labels:
      role: controller
    destination:
      namespace: hga-system
    syncOptions:
      - CreateNamespace=true
      # The Argo CD CRDs exceed the client-side annotation limit.
      - ServerSideApply=true
    sources:
      - path: charts/harness-gitops-agent-controller
        helm:
          releaseName: hga-controller
          namespace: hga-system

  # The agent runtime on every spoke: <spoke>-runtime on that spoke, in
  # namespace <spoke>, in sync waves:
  #
  #   wave 0  charts/gitops-agent: Argo CD with its CRDs, the agent's config.
  #   wave 1  charts/agent-registration: the locked default AppProject and
  #           the HarnessGitopsAgent.
  #   wave 3  the agent Deployment. The spoke's controller writes the token.
  #
  # Values: tenants/<tenant>/gitops-agents/defaults/values.yaml, then
  # <stage>/values.yaml.
  spoke-runtime:
    selector:
      matchLabels:
        fleet_member: spoke
      matchExpressions:
        - {key: tenant, operator: Exists}
        - {key: stage, operator: Exists}
    name: '{{ .name }}-runtime'
    labels:
      role: runtime
    destination:
      namespace: '{{ .name }}'
    syncOptions:
      - CreateNamespace=true
      # The Argo CD CRDs exceed the client-side annotation limit.
      - ServerSideApply=true
    sources:
      - ref: values
      # Wave 0: Argo CD and the agent runtime; the agent Deployment is wave 3.
      - path: charts/gitops-agent
        helm:
          # Never change: the argo-cd subchart bakes it into immutable
          # selectors.
          releaseName: hga-agent
          ignoreMissingValueFiles: true
          valueFiles:
            - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/defaults/values.yaml'
            - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/{{ .metadata.labels.stage }}/values.yaml'
          valuesObject:
            gitopsAgent:
              # Agent-registration renders the agent object. The teams-bootstrap
              # chart renders team mappings.
              harnessAgent:
                enabled: false
              # A real empty list: gitops-helm fails if mappings exist while
              # the agent object is off, and a null breaks its len check.
              projectMappings: []
              # Needs the CRDs at render time; the next source renders the
              # AppProjects instead.
              appProject:
                enabled: false
              harness:
                identity:
                  accountIdentifier: '{{ .metadata.annotations.harness_account_id }}'
                  orgIdentifier: '{{ .metadata.labels.tenant }}'
                  projectIdentifier: ""
                  agentIdentifier: '{{ .name | replace "-" "_" }}'
              agent:
                harnessName: '{{ .name }}'
                existingSecrets:
                  # Written by the controller. Never let the chart create it:
                  # an empty token fails for the wrong reason.
                  agentToken: '{{ .name }}-agent-token'
                # Last: it is Healthy only once the controller has written its
                # token, and must not hold back the other waves.
                deploymentAnnotations:
                  argocd.argoproj.io/sync-wave: "3"
              argo-cd:
                # Arbitrary objects and extra cluster Secrets from a tenant
                # file would bypass the AppProjects.
                extraObjects: []
                configs:
                  clusterCredentials: null
            apiKeySecret:
              create: false
            gitSecret:
              create: false
            rootAppSet:
              enabled: false
            hubCluster:
              enabled: false
      # Wave 1: the locked default AppProject and the agent object.
      - path: charts/agent-registration
        helm:
          releaseName: '{{ .name }}'
          # The stage file is optional.
          ignoreMissingValueFiles: true
          valueFiles:
            - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/defaults/values.yaml'
            - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/{{ .metadata.labels.stage }}/values.yaml'
          # Enforced over the tenant files. Keep equal to the runtime's
          # identity above.
          valuesObject:
            gitopsAgent:
              harnessAgent:
                metadata:
                  name: '{{ .name }}'
                spec:
                  name: '{{ .name }}'
                  # Scope, kind and key are never a tenant file's choice, and
                  # the agent never adopts another one.
                  scope: ORG
                  operator: ARGO
                  type: MANAGED_ARGO_PROVIDER
                  existingAgentIdentifier: ""
                  apiKeySecretRef: harness-api-key-secret
                  tokenSecretRef: '{{ .name }}-agent-token'
              agent:
                existingSecrets:
                  agentToken: '{{ .name }}-agent-token'
              harness:
                identity:
                  accountIdentifier: '{{ .metadata.annotations.harness_account_id }}'
                  orgIdentifier: '{{ .metadata.labels.tenant }}'
                  projectIdentifier: ""
                  agentIdentifier: '{{ .name | replace "-" "_" }}'

  # The team side on every spoke: <spoke>-teams on that spoke, in namespace
  # <spoke>, running charts/teams-bootstrap with one entry per team from
  # tenants/<tenant>/gitops-agents/defaults/teams/<team>/values.yaml (every
  # stage), then <stage>/teams/<team>/values.yaml (overrides or extra teams):
  # its namespaces (wave 0), its AppProject (1), its mapping (2). On a new
  # spoke it retries until the agent's CRDs and agent object exist.
  spoke-teams:
    selector:
      matchLabels:
        fleet_member: spoke
      matchExpressions:
        - {key: tenant, operator: Exists}
        - {key: stage, operator: Exists}
    name: '{{ .name }}-teams'
    labels:
      role: teams
    destination:
      namespace: '{{ .name }}'
    syncOptions:
      - CreateNamespace=true
      # The Argo CD CRDs exceed the client-side annotation limit.
      - ServerSideApply=true
    sources:
      - ref: values
      # Waves 0 to 2: each team's namespaces, AppProject and mapping.
      - path: charts/teams-bootstrap
        helm:
          releaseName: '{{ .name }}-teams'
          # A stage without teams renders nothing.
          ignoreMissingValueFiles: true
          valueFiles:
            - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/defaults/teams/*/values.yaml'
            - '$values/tenants/{{ .metadata.labels.tenant }}/gitops-agents/{{ .metadata.labels.stage }}/teams/*/values.yaml'
          # Enforced: every mapping points at this spoke's agent.
          valuesObject:
            agentName: '{{ .name }}'
