# Template for one org shard. Copy values.yaml to
# environments/<environment>/orgs/<name>/values.yaml and replace every
# REPLACE_ value. <name> (a DNS label) becomes the namespace of the org's Argo
# CD, the Helm release and the Application suffix, so pick it once.
#
# bootstrap/orgs.yaml feeds this one file to two charts: charts/gitops-agent
# (namespaced Argo CD, ORG agent, project mappings) and charts/org-platform
# (workload namespaces, Roles, restricted cluster entry, AppProjects). It
# injects the account id and enforces the agent scope (ORG), the API-key
# Secret reference (the central one in hga-system), appProject,
# createClusterRoles, crds, cluster.inClusterEnabled and the four hub extras
# (apiKeySecret, gitSecret, rootAppSet, hubCluster), so do not set those.
#
# Plain Helm values only: Argo renders this file, and Argo cannot resolve
# Harness expressions.
#
# Committing the file is all it takes: no controller redeploy and no per-org
# API key. Developers' private repos need an Argo CD repository credential
# Secret in namespace <name>.
# The only namespaces the org's Argo CD can deploy to, shared by all of its
# projects. Created by the platform. Each must start with "<name>-".
workloadNamespaces:
  - REPLACE_NAME-dev
  - REPLACE_NAME-prod

# Repos the org's projects may deploy from. Empty means deny all.
sourceRepos:
  - REPLACE_SOURCE_REPO_URL

# Labels for the workload namespaces.
namespaceLabels:
  pod-security.kubernetes.io/enforce: baseline
  pod-security.kubernetes.io/warn: restricted

gitopsAgent:
  enabled: true
  harnessAgent:
    metadata:
      name: REPLACE_NAME-agent
    spec:
      name: REPLACE_NAME-agent
      tokenSecretRef: REPLACE_NAME-agent-token
  # One HarnessGitopsProjectMapping and one AppProject per entry (org-platform
  # reads this list too). appProject must not be default (org-platform locks
  # it).
  projectMappings:
    - name: REPLACE_PROJECT_A
      appProject: REPLACE_PROJECT_A
      projectId: REPLACE_PROJECT_A_ID
    - name: REPLACE_PROJECT_B
      appProject: REPLACE_PROJECT_B
      projectId: REPLACE_PROJECT_B_ID
  harness:
    gitopsServerHost: https://app.harness.io/prod1/gitops
    identity:
      orgIdentifier: REPLACE_ORG
      # Harness identifier: letters, digits and underscores.
      agentIdentifier: REPLACE_NAME_agent
  agent:
    # Must be unique on the cluster.
    harnessName: REPLACE_NAME-agent
    existingSecrets:
      # Must equal gitopsAgent.harnessAgent.spec.tokenSecretRef.
      agentToken: REPLACE_NAME-agent-token
