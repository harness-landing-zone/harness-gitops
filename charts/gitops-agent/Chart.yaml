apiVersion: v2
name: gitops-agent
description: >-
  The official gitops-helm 1.2.12 chart (Argo CD, Harness GitOps agent and its
  bootstrap resources) under alias gitopsAgent, plus four optional hub extras:
  API-key Secret, repository credential, hub cluster Secret, root
  ApplicationSet. All extras are off by default.
type: application
version: 0.1.0
dependencies:
  - name: gitops-helm
    alias: gitopsAgent
    version: "1.2.12"
    repository: "https://harness.github.io/gitops-helm/"
    condition: gitopsAgent.enabled
