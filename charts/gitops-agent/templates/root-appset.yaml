{{- /* Reference addition (not in the official chart).
Root ApplicationSet: the group installer. A git files generator over
rootAppSet.groupsPath stamps ONE Application per group file, named after the
group, which installs charts/application-sets with that file as its values
into the hub (hubCluster.name, or rootAppSet.destinationName). The chart
renders the group's ApplicationSets into this namespace.

Applied as post-install/post-upgrade hooks: hook manifests are built at fire
time, which is what lets these CRs ship in the SAME release as the Argo CRDs.
The official appproject.yaml cannot do that (it fails the render until the
AppProject CRD exists), so with rootAppSet.createProject the AppProject named
by rootAppSet.project is rendered here too, at weight 0, before the
ApplicationSet at weight 1. before-hook-creation recreates both on every
upgrade (absorbing a copy Argo CD or a human created); with
preserveResourcesOnDeletion that is a metadata blip (the group Applications
are re-stamped, the ApplicationSets they track keep running). Argo runtime
placeholders are backtick-escaped so they reach the appset controller
literally. */}}
{{- $as := (.Values).rootAppSet }}
{{- /* enabled may arrive as the string "true" or "false" from an
ApplicationSet template, so it is compared as text. */}}
{{- if and $as (eq (toString $as.enabled) "true") .Values.gitopsAgent.enabled }}
{{- $repoURL := default (.Values.gitSecret).url $as.repoURL }}
{{- $revision := default "HEAD" $as.targetRevision }}
{{- if not $repoURL }}
{{- fail "rootAppSet.repoURL is required when gitSecret.url is not set" }}
{{- end }}
{{- if $as.createProject }}
{{- if .Values.gitopsAgent.appProject.enabled }}
{{- fail "set rootAppSet.createProject or gitopsAgent.appProject.enabled, not both" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ default "default" $as.project | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    {{- include "gitops-agent.labels" . | nindent 4 }}
spec:
  {{- /* Same permissive spec as the official appproject.yaml. */}}
  description: {{ .Values.gitopsAgent.appProject.description | quote }}
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ default "groups" $as.name | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    {{- include "gitops-agent.labels" . | nindent 4 }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
    {{- /* Never delete a group's Application: removing a group file leaves
    its ApplicationSets in place. */}}
    applicationsSync: create-update
  generators:
    - git:
        repoURL: {{ $repoURL | quote }}
        revision: {{ $revision | quote }}
        files:
          {{- range (default (list "*") $as.groups) }}
          - path: {{ printf "%s/%s.yaml" (default "groups" $as.groupsPath) . | quote }}
          {{- end }}
  template:
    metadata:
      name: '{{`{{ trimSuffix ".yaml" .path.filename }}`}}'
      labels:
        group: '{{`{{ trimSuffix ".yaml" .path.filename }}`}}'
    spec:
      project: {{ default "default" $as.project | quote }}
      sources:
        - repoURL: {{ $repoURL | quote }}
          targetRevision: {{ $revision | quote }}
          ref: values
        - repoURL: {{ $repoURL | quote }}
          targetRevision: {{ $revision | quote }}
          path: charts/application-sets
          helm:
            releaseName: '{{`{{ trimSuffix ".yaml" .path.filename }}`}}'
            valueFiles:
              - '$values/{{`{{ .path.path }}/{{ .path.filename }}`}}'
            valuesObject:
              group: '{{`{{ trimSuffix ".yaml" .path.filename }}`}}'
              revision: {{ $revision | quote }}
              project: {{ default "default" $as.project | quote }}
      destination:
        namespace: {{ .Release.Namespace | quote }}
        name: {{ default (default "hub-cluster" (.Values.hubCluster).name) $as.destinationName | quote }}
      syncPolicy:
        automated:
          selfHeal: true
          {{- /* A group file removed from git leaves its ApplicationSets. */}}
          prune: false
        retry:
          limit: 20
          backoff:
            duration: 1m
{{- end }}
