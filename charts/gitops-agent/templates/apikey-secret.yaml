{{- /* Reference addition (not in the official chart). Creates the Harness
API-key Secret so a CD system can inject the key at deploy time. The
controller looks it up by name = gitopsAgent.harnessAgent.spec.apiKeySecretRef, data key
api_key, in the namespace given by its --api-key-secret-namespace flag (the
controller chart's manager.apiKeySecretNamespace, default: the controller's
release namespace). Set apiKeySecret.namespace to that namespace; it defaults
to this release namespace only for a controller run without the flag. */}}
{{- $key := .Values.apiKeySecret }}
{{- $root := . }}
{{- if and $key $key.create }}
{{- $value := required "apiKeySecret.value is required when apiKeySecret.create is true" $key.value -}}
{{- $name := required "gitopsAgent.harnessAgent.spec.apiKeySecretRef is required" ((.Values.gitopsAgent.harnessAgent).spec).apiKeySecretRef -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ default .Release.Namespace $key.namespace }}
  labels:
    {{- include "gitops-agent.labels" . | nindent 4 }}
  {{- if $key.keep }}
  annotations:
    # The controller finalizer reads this Secret to deregister the agent in
    # Harness during CR deletion; Helm must not remove it before the CR.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  api_key: {{ $value | quote }}
{{- /* More key Secrets beside it, one per name, only with create: an agent
object picks one with spec.apiKeySecretRef (for example a business unit's
org-scoped key). */}}
{{- range $name, $value := $key.extra }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ default $root.Release.Namespace $key.namespace }}
  labels:
    {{- include "gitops-agent.labels" $root | nindent 4 }}
  {{- if $key.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  api_key: {{ required (printf "apiKeySecret.extra.%s needs a value" $name) $value | quote }}
{{- end }}
{{- end }}
