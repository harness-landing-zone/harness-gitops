# This chart's own keys, plus the few gitops-helm defaults it changes. Every
# other gitops-helm value goes under gitopsAgent (see its values.yaml), including
# its bootstrap keys gitopsAgent.harnessAgent, gitopsAgent.projectMappings and
# gitopsAgent.appProject. global stays at the values root.

gitopsAgent:
  # Condition of the gitops-helm dependency.
  enabled: true
  # The few defaults this chart changes in gitops-helm, for the hub and every
  # spoke runtime alike.
  # Render the HarnessGitopsAgent (gitops-helm defaults to false).
  harnessAgent:
    enabled: true
  # The upgrader CronJob reads the chart-managed token Secret, which does not
  # exist when the controller writes the token (agent.existingSecrets).
  upgrader:
    enabled: false
  harness:
    configMap:
      http:
        agentHttpTarget: https://app.harness.io/gitops
      logLevel: info
  # Smaller than gitops-helm's 1 CPU per component, so the hub and each
  # spoke fit on a small cluster.
  agent:
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  argo-cd:
    configs:
      params:
        server.repo.server.timeout.seconds: "300"
        controller.repo.server.timeout.seconds: "300"
    controller:
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: 1, memory: 2Gi}
    applicationSet:
      resources:
        requests: {cpu: 250m, memory: 256Mi}
        limits: {cpu: 500m, memory: 512Mi}
    repoServer:
      resources:
        requests: {cpu: 500m, memory: 512Mi}
        limits: {cpu: 1, memory: 1Gi}
      # Harness plugin sidecar off (gitops-helm has no switch; its only extra
      # container is argocd-harness-plugin, 1 CPU and 1Gi reserved). Its
      # ConfigMap and volume still render, unused. Set the list back to
      # enable it.
      extraContainers: []
    redis:
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}

# Creates the Harness API-key Secret the controller reads. Its name is
# gitopsAgent.harnessAgent.spec.apiKeySecretRef and its data key is api_key.
apiKeySecret:
  create: false
  # The controller's API-key namespace (controller chart
  # manager.apiKeySecretNamespace, default: the controller's release
  # namespace). Empty means this release namespace.
  namespace: ""
  # Supply only at deploy time from the CD platform's secret manager.
  value: ""
  # More key Secrets in the same namespace, name: value, for example a
  # tenant's org-scoped key. Same supply rule as value.
  extra: {}
  # Keep the Secret on helm uninstall: the controller finalizer still needs it
  # to deregister the agent while the agent object is deleted.
  keep: true

# Registers a Git repository in the bundled Argo CD (Secret labelled
# argocd.argoproj.io/secret-type: repository, in the release namespace).
# githubAppID and githubAppInstallationID must be QUOTED strings. Give the
# private key raw (githubAppPrivateKey, multiline PEM), base64-encoded
# (githubAppPrivateKeyB64, one line), or the whole credential as one
# single-line JSON object (githubAppJson).
gitSecret:
  create: false
  name: bootstrap-repo
  url: ""
  githubAppID: ""
  githubAppInstallationID: ""
  githubAppPrivateKey: ""
  githubAppPrivateKeyB64: ""
  githubAppJson: ""
  # Optional Argo repository display name.
  repoName: ""
  # Optional AppProject the repository is scoped to. Empty = global.
  project: ""
  # Also render a global repo-creds Secret (<name>-creds) with the same
  # credential: ApplicationSet git generators resolve credentials outside any
  # AppProject, so a project-scoped repository alone is invisible to them.
  credsTemplate: false

# Hub self-registration: an Argo CD cluster Secret naming THIS cluster, with
# the labels the group ApplicationSets select on. A plain resource, not a hook.
hubCluster:
  enabled: false
  # Argo cluster name AND Secret name.
  name: hub-cluster
  server: https://kubernetes.default.svc
  fleetMember: hub-cluster
  # Extra labels/annotations stamped on the Secret.
  labels: {}
  annotations: {}

# Root ApplicationSet: the group installer. For each file in groupsPath it
# makes one Application named after the group, on the hub, which installs charts/application-sets with that file as its values. A
# post-install/post-upgrade hook, so it can ship in the same release as the
# Argo CRDs.
rootAppSet:
  enabled: false
  name: groups
  # Empty falls back to gitSecret.url.
  repoURL: ""
  # Folder of group files in that repository: one values file per group.
  groupsPath: groups
  # Branch, tag or commit for the group files, the chart and what the groups
  # install from this repository.
  targetRevision: HEAD
  # Destination cluster of the group Applications. Empty: hubCluster.name.
  destinationName: ""
  # AppProject of the group Applications.
  project: default
  # Also create that AppProject as a hook (weight 0, before the
  # ApplicationSet), with gitopsAgent.appProject.description. Use this instead
  # of gitopsAgent.appProject.enabled when this release installs the Argo CRDs.
  createProject: false
