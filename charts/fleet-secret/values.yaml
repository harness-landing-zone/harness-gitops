# Registers one cluster Secret into an Argo CD / Harness GitOps Agent namespace,
# driven by fleet-registration/<agent>/cluster-members/<cluster>.yaml:
#
#   mode: local  - Least-privilege target on this same cluster: Delivery SA +
#                  token, team workload namespaces (PSA + Delete=false),
#                  workload RoleBindings, and a namespace-scoped ESO
#                  SecretStore/ExternalSecret building Secret/<cluster.name>
#                  with namespaces + clusterResources="false".
#   mode: remote - Remote cluster registration: ESO ExternalSecret pulling
#                  {server, caData, token} from a secret store into
#                  Secret/<cluster.name>.
# mode, tenant and environment are read straight from the cluster file.
mode: local
# Harness organization identifier (required for mode: local; optional for mode: remote).
tenant: ""
# Optional environment label (e.g. dev, test, prod).
environment: ""

cluster:
  # Set by bootstrap/fleet-members.yaml or fleet-registrations.yaml from the file name.
  name: ""

# --- mode: local settings ----------------------------------------------------
local:
  # Uses kubernetes.default.svc.cluster.local so Argo CD's implicit in-cluster
  # URL (https://kubernetes.default.svc) stays disabled via cluster.inClusterEnabled=false.
  server: https://kubernetes.default.svc.cluster.local
  refreshInterval: 5m
  agentReadLogs: false

# The rules delivery identities get in team namespaces live once, in
# ClusterRole gitops-delivery (charts/hub-bootstrap); this chart only binds it.

# Merged from tenants/<tenant>/teams/*/values.yaml when mode: local.
teams: {}

# --- mode: remote settings ---------------------------------------------------
remote:
  secretStoreKind: ClusterSecretStore
  secretStore: hub-secret-store
  # Required: the store entry holding server, caData and token (for example
  # clusters/spoke-1, written by the spoke's tofu). Never taken from the file name.
  remoteKey: ""
  refreshInterval: 1m
  # Optional namespace/cluster-resource restriction for remote Org Agent targets.
  namespaces: ""
  clusterResources: ""
  # Optional extra labels (e.g. enable_external_secrets: "true").
  labels: {}
  # Annotations copied from the hub cluster Secret (repo_url, repo_revision,
  # harness_account_id).
  annotations: {}
