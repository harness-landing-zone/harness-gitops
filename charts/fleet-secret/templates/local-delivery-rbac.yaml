{{- if eq (default "local" .Values.mode) "local" }}
{{- include "fleet-secret.validateLocal" . }}
{{- $cluster := .Values.cluster.name }}
{{- $tenant := .Values.tenant }}
{{- $deliverySA := printf "%s-delivery" $cluster }}
{{- $deliveryToken := printf "%s-delivery-token" $cluster }}
# Dedicated least-privilege delivery identity for this local cluster target.
# Never mounted into any pod (automountServiceAccountToken: false); Argo CD
# authenticates with its token through Secret/<cluster>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $deliverySA | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-secret.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $deliveryToken | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-secret.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ $deliverySA | quote }}
    argocd.argoproj.io/sync-wave: "-1"
type: kubernetes.io/service-account-token
{{- range $team, $t := .Values.teams }}
{{- range (default (list) $t.namespaces) }}
---
# Workload namespace: Prune=false,Delete=false guarantees deleting this cluster
# registration revokes Argo CD access without deleting running workloads.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . | quote }}
  labels:
    {{- include "fleet-secret.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: {{ $team | quote }}
    tenant: {{ $tenant | quote }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "0"
    helm.sh/resource-policy: keep
---
# Lets this agent's delivery identity deploy into this namespace, using the
# one shared rule set (ClusterRole workload-edit, the add-on addons/workload-edit).
# Bound per namespace, so it grants nothing anywhere else. Named
# <agent>-<cluster>-delivery: two agents registering the same cluster each get
# their own binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s-delivery" $.Release.Namespace $cluster | quote }}
  namespace: {{ . | quote }}
  labels:
    {{- include "fleet-secret.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: {{ $team | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workload-edit
subjects:
  - kind: ServiceAccount
    name: {{ $deliverySA | quote }}
    namespace: {{ $.Release.Namespace }}
{{- if $.Values.local.agentReadLogs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-%s-agent-read-logs" $.Release.Namespace $cluster | quote }}
  namespace: {{ . | quote }}
  labels:
    {{- include "fleet-secret.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s-agent-read-logs" $.Release.Namespace $cluster | quote }}
  namespace: {{ . | quote }}
  labels:
    {{- include "fleet-secret.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-%s-agent-read-logs" $.Release.Namespace $cluster | quote }}
subjects:
  - kind: ServiceAccount
    name: gitops-agent
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
