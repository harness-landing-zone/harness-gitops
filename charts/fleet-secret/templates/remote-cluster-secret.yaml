{{- if eq (default "local" .Values.mode) "remote" }}
{{- include "fleet-secret.validateCommon" . }}
{{- $name := .Values.cluster.name }}
{{- $tenant := .Values.tenant }}
{{- $env := .Values.environment }}
{{- $rc := .Values.remote }}
{{- $store := required "remote.secretStore is required when mode is remote" $rc.secretStore }}
{{- $storeKind := default "ClusterSecretStore" $rc.secretStoreKind }}
{{- $remoteKey := default (printf "clusters/%s" $name) $rc.remoteKey }}
# Registers a remote cluster as an Argo CD cluster Secret in the target agent
# namespace via ESO. Expected keys at remoteKey: server, caData, token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-secret.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ default "1m" $rc.refreshInterval }}
  secretStoreRef:
    kind: {{ $storeKind | quote }}
    name: {{ $store | quote }}
  data:
    {{- range list "server" "caData" "token" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: {{ . }}
    {{- end }}
  target:
    name: {{ $name | quote }}
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          fleet_member: spoke
          cluster_mode: remote
          {{- with $tenant }}
          tenant: {{ . | quote }}
          {{- end }}
          {{- with $env }}
          environment: {{ . | quote }}
          {{- end }}
          {{- range $k, $v := $rc.labels }}
          {{- if has $k (list "argocd.argoproj.io/secret-type" "fleet_member" "cluster_mode" "tenant" "environment") }}
          {{- fail (printf "remote.labels: %q is reserved and set by the chart" $k) }}
          {{- end }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
        {{- with $rc.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      data:
        name: {{ $name | quote }}
        server: "{{`{{ .server }}`}}"
        {{- with $rc.namespaces }}
        namespaces: {{ . | quote }}
        {{- end }}
        {{- with $rc.clusterResources }}
        clusterResources: {{ . | quote }}
        {{- end }}
        config: '{"bearerToken":"{{`{{ .token }}`}}","tlsClientConfig":{"caData":"{{`{{ .caData }}`}}"}}'
{{- end }}
