{{- if eq (default "local" .Values.mode) "local" }}
{{- include "fleet-secret.validateLocal" . }}
{{- $cluster := .Values.cluster.name }}
{{- $deliveryToken := printf "%s-delivery-token" $cluster }}
{{- $esoSA := printf "%s-eso-reader" $cluster }}
{{- $storeName := printf "%s-delivery-store" $cluster }}
{{- $server := default "https://kubernetes.default.svc.cluster.local" .Values.local.server }}
{{- $namespaces := include "fleet-secret.allNamespaces" . }}
{{- if not $namespaces }}
{{- fail "fleet-secret: at least one team namespace is required when mode is local" }}
{{- end }}
# Namespace-scoped ESO reader: can read ONLY the delivery token Secret in this
# namespace so ESO declaratively builds the Argo CD cluster Secret without an
# external secret manager or tokens in git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $esoSA | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-secret.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $esoSA | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-secret.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $deliveryToken | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $esoSA | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-secret.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $esoSA | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $esoSA | quote }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $storeName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-secret.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $esoSA | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cluster | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-secret.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ default "5m" .Values.local.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $storeName | quote }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ $deliveryToken | quote }}
        property: token
    - secretKey: ca
      remoteRef:
        key: {{ $deliveryToken | quote }}
        property: ca.crt
  target:
    name: {{ $cluster | quote }}
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          cluster_mode: local
          tenant: {{ .Values.tenant | quote }}
          {{- with .Values.environment }}
          environment: {{ . | quote }}
          {{- end }}
      data:
        name: {{ $cluster | quote }}
        server: {{ $server | quote }}
        namespaces: {{ $namespaces | quote }}
        clusterResources: "false"
        config: '{"bearerToken":"{{`{{ .token }}`}}","tlsClientConfig":{"caData":"{{`{{ .ca | b64enc }}`}}"}}'
{{- end }}
