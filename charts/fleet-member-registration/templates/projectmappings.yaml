{{- /* One mapping per entry. Its AppProject must be one of appProjects: the
controller marks a mapping Ready only once an AppProject of that name exists
beside the agent object. */}}
{{- $seen := dict }}
{{- range $i, $m := .Values.gitopsAgent.projectMappings }}
{{- $name := required (printf "gitopsAgent.projectMappings[%d].name is required" $i) $m.name }}
{{- if hasKey $seen $name }}
{{- fail (printf "gitopsAgent.projectMappings: duplicate name %q" $name) }}
{{- end }}
{{- $_ := set $seen $name true }}
{{- $project := required (printf "gitopsAgent.projectMappings[%d].appProject is required" $i) $m.appProject }}
{{- if eq $project "default" }}
{{- fail "gitopsAgent.projectMappings: appProject \"default\" is reserved, it is locked" }}
{{- end }}
{{- if not (hasKey $.Values.appProjects $project) }}
{{- fail (printf "gitopsAgent.projectMappings[%d]: appProject %q has no appProjects entry (its team file)" $i $project) }}
{{- end }}
---
apiVersion: gitops.harness.io/v1alpha1
kind: HarnessGitopsProjectMapping
metadata:
  name: {{ $name | quote }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    # Delete=false: deleting it runs the controller finalizer, which removes the
    # mapping in Harness. Unmapping a team is a manual delete.
    argocd.argoproj.io/sync-options: Delete=false,SkipDryRunOnMissingResource=true
    # After the agent object and the AppProjects (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  agentRef:
    name: {{ $.Values.gitopsAgent.harnessAgent.metadata.name | quote }}
  appProject: {{ $project | quote }}
  projectId: {{ required (printf "gitopsAgent.projectMappings[%d].projectId is required" $i) $m.projectId | quote }}
  autoCreateServiceEnv: {{ default false $m.autoCreateServiceEnv }}
{{- end }}
