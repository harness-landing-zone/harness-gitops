{{- /*
Hub model only. The hub's controller writes the agent's token Secret in this
namespace; ESO copies it to the same name in the same namespace on the spoke
(through the push-<cluster> store, which only this namespace may use). It
errors and retries until the token and the spoke namespace exist. No secretKey
or property: the whole Secret is copied.
*/}}
{{- if eq .Values.target "hub" }}
{{- $token := .Values.gitopsAgent.harnessAgent.spec.tokenSecretRef }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ $token | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # After the agent object (wave 1), whose controller writes the token.
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 5m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: push-{{ .Values.gitopsAgent.harnessAgent.metadata.name }}
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ $token | quote }}
  data:
    - match:
        remoteRef:
          remoteKey: {{ $token | quote }}
{{- end }}
