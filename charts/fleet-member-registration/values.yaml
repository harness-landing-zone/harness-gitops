# The agent's Harness side: the HarnessGitopsAgent and the locked default
# AppProject, in the agent's namespace beside the controller that registers it.
# Same keys as charts/gitops-agent (gitopsAgent.*). The teams are
# charts/teams-bootstrap.

# all (default, v1): the agent object and the locked default AppProject here.
# hub: the agent object and the PushSecret (the hub model, rendered on the hub
# in namespace <cluster>). spoke: only the locked default AppProject (the hub
# model's spoke side).
target: all

gitopsAgent:
  harnessAgent:
    metadata:
      # Required: the object's name.
      name: ""
    spec:
      # Empty means the identifier.
      name: ""
      scope: ORG
      operator: ARGO
      type: MANAGED_ARGO_PROVIDER
      # Required: the key Secret in the controller's namespace (hga-system).
      apiKeySecretRef: ""
      # Required: the Secret the controller writes the agent's token to, in
      # this namespace. Must equal agent.existingSecrets.agentToken.
      tokenSecretRef: ""
      existingAgentIdentifier: ""
  # The runtime's token Secret; checked against tokenSecretRef when set.
  agent:
    existingSecrets:
      agentToken: ""
  harness:
    identity:
      accountIdentifier: ""
      orgIdentifier: ""
      projectIdentifier: ""
      agentIdentifier: ""
