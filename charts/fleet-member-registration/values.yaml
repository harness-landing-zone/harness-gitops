# Same keys as charts/gitops-agent (gitopsAgent.*), so one values file feeds
# this chart and the runtime. Everything renders into the release namespace,
# beside the controller that registers it.

gitopsAgent:
  harnessAgent:
    metadata:
      # Required: the object's name.
      name: ""
    spec:
      # Empty means the identifier.
      name: ""
      scope: ORG
      operator: ARGO
      type: MANAGED_ARGO_PROVIDER
      # Required: the key Secret in the controller's namespace (hga-system).
      apiKeySecretRef: ""
      # Required: the Secret the controller writes the agent's token to, in
      # this namespace. Must equal agent.existingSecrets.agentToken.
      tokenSecretRef: ""
      existingAgentIdentifier: ""
  # The runtime's token Secret; checked against tokenSecretRef when set.
  agent:
    existingSecrets:
      agentToken: ""
  # One per team: the team's AppProject (an appProjects entry below) and the
  # Harness project in the agent's org it maps to.
  #   - name: team-a
  #     appProject: team-a
  #     projectId: team_a
  projectMappings: []
  harness:
    identity:
      accountIdentifier: ""
      orgIdentifier: ""
      projectIdentifier: ""
      agentIdentifier: ""

# One entry per team, keyed by the AppProject name (one file per team, merged).
# Only these keys are read; the rest is forced: no cluster-scoped resources,
# no gitops.harness.io objects.
#   team-a:
#     description: Team a
#     sourceRepos:             # exact URLs, no patterns
#       - https://github.com/example/team-a.git
#     destinations:            # this cluster only; namespace starts "team-a-"
#       - server: https://kubernetes.default.svc
#         namespace: team-a-*
appProjects: {}
