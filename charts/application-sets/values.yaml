# Renders one ApplicationSet per entry under applicationSets. Installed once per
# group by a plain ApplicationSet in bootstrap/ (today only addons.yaml).

group: ""
revision: HEAD
repoURL: '{{ .metadata.annotations.repo_url }}'
project: platform-admin
labels: {}
addonValueFiles: []

syncPolicyAppSet:
  preserveResourcesOnDeletion: true
  applicationsSync: create-update

# retry: a fresh hub converges while CRDs and the store arrive (Argo does not
# re-run a failed auto-sync of the same commit without it). Known: Harness's
# protobuf-JSON API may serialize retry.limit as a string, which can break
# Validate/Save of these Applications in the Harness UI; Argo is unaffected.
syncPolicy:
  automated:
    selfHeal: true
    prune: false
  retry:
    limit: 100
    backoff:
      duration: 1m

applicationSets: {}
