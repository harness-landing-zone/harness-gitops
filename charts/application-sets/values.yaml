syncPolicy:
  automated:
    selfHeal: false
    allowEmpty: true
    prune: false
  retry:
    limit: -1 # number of failed sync attempt retries; unlimited number of attempts if less than 0
    backoff:
      duration: 5s # the amount to back off. Default unit is seconds, but could also be a duration (e.g. "2m", "1h")
      factor: 2 # a factor to multiply the base duration after each failed retry
      maxDuration: 10m # the maximum amount of time allowed for the backoff strategy
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true  # Big CRDs.
syncPolicyAppSet:
  preserveResourcesOnDeletion: true
useSelectors: true
repoURLGit: '{{.metadata.annotations.addons_repo_url}}'
repoURLGitRevision: '{{.metadata.annotations.addons_repo_revision}}'
repoURLGitBasePath: '{{.metadata.annotations.addons_repo_basepath}}'
valueFiles:
  - default/addons
  - clusters/{{.nameNormalized}}/addons
useValuesFilePrefix: true
valuesFilePrefix: '{{.metadata.labels.tenant}}/'
# Argo CD AppProject of every generated Application; an entry's own project
# wins. May be an Argo CD expression, e.g. '{{.metadata.labels.tenant}}'.
project: default
# Labels on every generated Application (unset: none). An entry's own
# labelsApp replaces them.
# labelsApp: {}
#
# Per entry, beside Fleet Management's keys:
#   labelsApp        the generated Application's labels, replacing the
#                    top-level labelsApp.
#   extraValueFiles  value files added after the ladder, verbatim; may hold
#                    Argo CD expressions, e.g. '$values/{{ .path.path }}/{{ .path.filename }}'
#                    for a gitMatrix entry's own file.
