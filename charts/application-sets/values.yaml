# Renders one ApplicationSet per entry under applicationSets. The entries live
# in a values file of their own (spoke-bootstrap/values.yaml); this file holds
# only what every ApplicationSet shares.
#
# Argo CD expressions ({{ .name }} and the like) are written as plain strings
# in values: Helm never templates values, so they reach the ApplicationSet
# controller unchanged.

# targetRevision of every source the ApplicationSets render. The installer
# (bootstrap/spokes.yaml) sets it from the hub cluster Secret's annotation
# repo_revision, HEAD when that annotation is missing. A literal by the time
# this chart renders.
revision: HEAD

# repoURL of every source that names none. Evaluated per cluster by Argo CD.
repoURL: '{{ .metadata.annotations.repo_url }}'

# Every Application lands in this Argo CD project.
project: default

# Application labels every entry gets; an entry's labels override them key by
# key. Harness indexes an Application's labels only when it is created, so
# changing these means recreating every Application.
labels:
  cluster: '{{ .name }}'
  tenant: '{{ .metadata.labels.tenant }}'
  stage: '{{ .metadata.labels.stage }}'

# The ApplicationSet's own sync policy.
syncPolicyAppSet:
  # Deleting an Application never deletes what it deployed: the agent object
  # and mappings (whose finalizers deregister them in Harness) and the
  # ExternalSecret that owns a spoke's cluster Secret.
  preserveResourcesOnDeletion: true
  # Never delete a generated Application. Removing a cluster stays manual.
  applicationsSync: create-update

# Every Application's sync policy; an entry adds syncOptions.
syncPolicy:
  automated:
    selfHeal: true
    # Removing anything stays a deliberate act.
    prune: false
  retry:
    limit: 20
    backoff:
      duration: 1m

# One entry per ApplicationSet; the key is its name. Per entry:
#   enabled      false skips it (default true).
#   selector     the clusters generator's selector.
#   gitFiles     a git files path: the generator becomes the clusters
#                generator times one entry per matching file (repoURL and
#                revision as below), as Fleet Management's gitMatrix.
#   name         the Application name.
#   labels       merged over the labels above.
#   destination  name (default '{{ .name }}', the generated cluster) and
#                namespace.
#   syncOptions  added to syncPolicy.
#   sources      verbatim, except that repoURL and targetRevision are filled
#                in where a source leaves them out. An entry's sources are
#                close to a pass-through of the Application spec: the chart
#                saves the repeated repoURL, revision and policies, not the
#                per-chart values.
applicationSets: {}
