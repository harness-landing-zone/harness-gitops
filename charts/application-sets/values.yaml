# Renders one ApplicationSet per entry under applicationSets. Installed once per
# group by the hub's root ApplicationSet (charts/hub-bootstrap) from groups/*.yaml.

group: ""
revision: HEAD
repoURL: '{{ .metadata.annotations.repo_url }}'
project: platform-admin
labels: {}
addonValueFiles: []

syncPolicyAppSet:
  preserveResourcesOnDeletion: true
  applicationsSync: create-update

syncPolicy:
  automated:
    selfHeal: true
    prune: false
  retry:
    limit: 20
    backoff:
      duration: 10s
      maxDuration: 1m

applicationSets: {}
