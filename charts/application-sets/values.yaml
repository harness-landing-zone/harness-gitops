# Renders one ApplicationSet per entry under applicationSets. Installed once per
# fleet group by the hub's root ApplicationSet (charts/hub-bootstrap) from fleet/*.yaml.

group: ""
revision: HEAD
repoURL: '{{ .metadata.annotations.repo_url }}'
project: platform-admin
labels: {}
addonValueFiles: []

syncPolicyAppSet:
  preserveResourcesOnDeletion: true
  applicationsSync: create-update

# Omit retry.limit by default: Harness's GitOps protobuf-JSON API serializes
# int64 fields like retry.limit as quoted strings ("20"), which causes Harness
# UI Validate/Save to fail with "cannot unmarshal string into int64".
syncPolicy:
  automated:
    selfHeal: true
    prune: false

applicationSets: {}
