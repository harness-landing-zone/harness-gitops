apiVersion: v2
name: harness-gitops-agent-bootstrap
description: Official harness-gitops-agent-bootstrap 0.4.0 plus four additive reference templates (apikey-secret.yaml, bootstrap-repo.yaml, hub-cluster-secret.yaml, root-appset.yaml), all off by default.
type: application
version: 0.4.0-ref.1
appVersion: "v0.121.0"
annotations:
  reference/upstream-chart-version: "0.4.0"
  reference/upstream-commit: "57a643adbaf3ac2addfc0fe9d58ac58f02c2267d"
  reference/additive-templates: "templates/apikey-secret.yaml, templates/bootstrap-repo.yaml, templates/hub-cluster-secret.yaml, templates/root-appset.yaml"
keywords:
  - harness
  - gitops
  - argo-cd
  - bootstrap
dependencies:
  - name: gitops-helm
    alias: gitopsAgent
    version: "1.2.7"
    repository: "https://harness.github.io/gitops-helm/"
    condition: gitopsAgent.enabled
