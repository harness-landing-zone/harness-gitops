{{- /* Reference addition (not in the official chart).
Root ApplicationSet: a clusters generator over hub-labeled cluster Secrets (the
hubCluster Secret) stamps ONE root Application per hub, syncing a flat folder
of ApplicationSets to that hub BY NAME. The generated Application pins an
EXPLICIT directory source, so CMP discovery never go-templates the
ApplicationSet placeholders it syncs.

Applied as post-install/post-upgrade hooks: hook manifests are built at fire
time, which is what lets these CRs ship in the SAME release as the Argo CRDs.
The official appproject.yaml cannot do that (it fails the render until the
AppProject CRD exists), so with rootAppSet.createProject the AppProject named
by rootAppSet.project is rendered here too, at weight 0, before the
ApplicationSet at weight 1. before-hook-creation recreates both on every
upgrade (absorbing a copy Argo CD or a human created); with
preserveResourcesOnDeletion that is a metadata blip (generated Applications
are re-stamped, their children keep running). Argo runtime placeholders are
backtick-escaped so they reach the appset controller literally. */}}
{{- $as := (.Values).rootAppSet }}
{{- if and $as $as.enabled .Values.gitopsAgent.enabled }}
{{- $repoURL := default ((.Values.harnessAgent).gitSecret).url $as.repoURL }}
{{- if not $repoURL }}
{{- fail "rootAppSet.repoURL is required when harnessAgent.gitSecret.url is not set" }}
{{- end }}
{{- if not $as.selector }}
{{- fail "rootAppSet.selector must not be empty - an empty clusters selector matches EVERY registered cluster, spokes included" }}
{{- end }}
{{- if $as.createProject }}
{{- if .Values.appProject.enabled }}
{{- fail "set rootAppSet.createProject or appProject.enabled, not both" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ default "default" $as.project | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    {{- include "harness-gitops-agent-bootstrap.labels" . | nindent 4 }}
spec:
  {{- /* Same permissive spec as the official appproject.yaml. */}}
  description: {{ .Values.appProject.description | quote }}
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ default "cluster-application-sets" $as.name | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    {{- include "harness-gitops-agent-bootstrap.labels" . | nindent 4 }}
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            {{- toYaml $as.selector | nindent 12 }}
  template:
    metadata:
      name: {{ default "cluster-application-sets" $as.name | quote }}
    spec:
      project: {{ default "default" $as.project | quote }}
      source:
        repoURL: {{ $repoURL | quote }}
        path: {{ default "gitops/bootstrap" $as.path | quote }}
        targetRevision: {{ default "HEAD" $as.targetRevision | quote }}
        directory:
          recurse: false
          exclude: exclude/*
      destination:
        namespace: {{ .Release.Namespace | quote }}
        {{- /* The backtick form survives exactly ONE Go template pass (helm's),
        so the ApplicationSet controller receives the literal placeholder.
        Installed through an Argo Application with the Harness plugin, the CMP
        runs a second pass and stores "<no value>"; set destinationName to a
        literal cluster name in that case. */}}
        {{- if $as.destinationName }}
        name: {{ $as.destinationName | quote }}
        {{- else }}
        name: '{{`{{.name}}`}}'
        {{- end }}
      syncPolicy:
        automated: {}
{{- end }}
