nameOverride: ""
fullnameOverride: ""

# Contract with the controller: the CR is rendered from these values plus the
# shared identity block under gitopsAgent.harness.identity (single source of
# truth for account/org/project/agent identifiers used by BOTH the CR and the
# runtime).
harnessAgent:
  enabled: true
  metadata:
    name: ""
    annotations: {}
    labels: {}
  spec:
    name: ""
    operator: ARGO
    scope: PROJECT
    type: MANAGED_ARGO_PROVIDER
    existingAgentIdentifier: ""
    # The Harness API key Secret must already exist in the namespace configured
    # on the controller. The controller Helm chart defaults that location to
    # its own release namespace. Its key is "api_key"; never put the value here.
    apiKeySecretRef: harness-api-key-secret
    tokenSecretRef: ""
  # --- Reference addition (templates/apikey-secret.yaml) ---
  # Optional: create the Secret named by spec.apiKeySecretRef (key api_key)
  # so a CD system can inject the key from its secret manager at deploy time.
  apiKeySecret:
    create: false
    # Namespace to render the Secret into. Set it to the controller's
    # API-key namespace (controller chart manager.apiKeySecretNamespace,
    # default: the controller's release namespace). Empty = this release
    # namespace, which is right only for a controller run without
    # --api-key-secret-namespace.
    namespace: ""
    # Supply only at deploy time from the CD platform's secret manager.
    value: ""
    # Keep the Secret on helm uninstall: the controller finalizer still needs
    # it to deregister the agent while the CR deletion completes.
    keep: true
  # --- Reference addition (templates/bootstrap-repo.yaml) ---
  # Optional: register the bootstrap Git repository in the bundled Argo CD as
  # a Secret labelled argocd.argoproj.io/secret-type: repository in the
  # release namespace. githubAppID and githubAppInstallationID must be QUOTED
  # strings. Supply the private key raw (githubAppPrivateKey, multiline PEM)
  # or base64-encoded (githubAppPrivateKeyB64, one line), or the whole
  # credential as one single-line JSON object (githubAppJson).
  gitSecret:
    create: false
    name: bootstrap-repo
    url: ""
    githubAppID: ""
    githubAppInstallationID: ""
    githubAppPrivateKey: ""
    githubAppPrivateKeyB64: ""
    githubAppJson: ""
    # Optional Argo repository display name.
    repoName: ""
    # Optional AppProject the repository is scoped to. Empty = global at the
    # agent's own scope.
    project: ""
    # Also render a GLOBAL repo-creds Secret (<name>-creds) with the same
    # credential: ApplicationSet git generators resolve credentials outside
    # any AppProject, so a project-scoped repository alone is invisible to
    # them.
    credsTemplate: false

# Each entry becomes one independently reconciled HarnessGitopsProjectMapping
# that references the Agent above. Add as many mappings as this Agent serves.
projectMappings: []
#  - name: default
#    appProject: default
#    # Required at ACCOUNT scope; projectId is also required at ORG scope.
#    # At PROJECT scope both are inherited and should normally be omitted.
#    orgId: ""
#    projectId: ""
#    autoCreateServiceEnv: false
#    # Optional explicit ownership request for an existing Harness mapping.
#    # The controller adopts only when this exact ID and full tuple match.
#    adoptMappingId: ""

appProject:
  enabled: false
  name: default
  description: AppProject created for the Harness GitOps Agent instance
  annotations: {}
  labels: {}

# --- Reference addition (templates/hub-cluster-secret.yaml) ---
# Hub self-registration: an argocd cluster Secret naming THIS cluster as a
# labelled Argo destination. The root ApplicationSet selects hubs by the
# fleet_member label. A plain resource, not a hook, so helm patches it in
# place on upgrade.
hubCluster:
  enabled: false
  # Argo cluster name AND Secret name.
  name: hub-cluster
  server: https://kubernetes.default.svc
  fleetMember: hub-cluster
  # Extra labels/annotations stamped on the Secret.
  labels: {}
  annotations: {}

# --- Reference addition (templates/root-appset.yaml) ---
# Root ApplicationSet: one root Application per hub-labelled cluster Secret,
# syncing a flat folder of ApplicationSets. A post-install/post-upgrade hook,
# so it can ship in the same release as the Argo CRDs.
rootAppSet:
  enabled: false
  name: cluster-application-sets
  # Which cluster Secrets count as hubs. Never empty.
  selector:
    fleet_member: hub-cluster
  # Empty falls back to harnessAgent.gitSecret.url.
  repoURL: ""
  path: gitops/bootstrap
  targetRevision: HEAD
  # Literal destination cluster name instead of the generator placeholder.
  # Required only when this chart is rendered through the Harness Argo plugin.
  destinationName: ""
  # AppProject of the root Application.
  project: default
  # Also create that AppProject as a hook (weight 0, before the
  # ApplicationSet). Use this instead of appProject.enabled when the Argo CRDs
  # are installed by this same release.
  createProject: false

# The controller must already be installed. The Agent CR and runtime can then
# be installed in one release: pods may briefly wait for the token Secret while
# the controller registers the Agent and writes it.
gitopsAgent:
  enabled: true
  argo-cd:
    enabled: true
    # Set install: false on clusters that already have the Argo CRDs (for
    # example a second agent instance, or an existing Argo CD install) so
    # disposable releases never fight over CRD ownership.
    crds:
      install: true
    configs:
      params:
        server.repo.server.timeout.seconds: "300"
        controller.repo.server.timeout.seconds: "300"
    controller:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 1
          memory: 2Gi
    applicationSet:
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    repoServer:
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
    redis:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # The Harness GitOps agent is headless; the Argo CD UI/API server is not
    # needed for agent operation.
    server:
      replicas: 0
    dex:
      enabled: false
    notifications:
      enabled: false
  harness:
    identity:
      accountIdentifier: ""
      orgIdentifier: ""
      projectIdentifier: ""
      agentIdentifier: ""
    configMap:
      http:
        tlsEnabled: false
        agentHttpTarget: https://app.harness.io/gitops
      logLevel: info
    # The agent health checks (list deployments, read pod logs) are granted
    # only by the chart's ClusterRole/ClusterRoleBinding. Their names derive
    # from agent.harnessName — override it per install so multiple instances
    # on one cluster never collide on the fixed default name.
    createClusterRoles: true
    networkPolicy:
      create: true
  agent:
    # Unique per install: names the agent ClusterRole/ClusterRoleBinding
    # (<harnessName>-agent). Leave the default only for a single-instance
    # cluster.
    harnessName: gitops-agent
    existingSecrets:
      # Must match harnessAgent.spec.tokenSecretRef; the template fails the
      # render on mismatch. The controller writes GITOPS_AGENT_TOKEN into this
      # Secret after registering the agent.
      agentToken: ""
    image:
      tag: v0.121.0
    replicas: 1
    highAvailability: false
    serviceAccount:
      create: true
      name: gitops-agent
      automountServiceAccountToken: true
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  # Disabled by default: the upgrader CronJob references the chart-managed
  # token Secret and fails with CreateContainerConfigError when
  # agent.existingSecrets.agentToken is used (the controller-written Secret
  # replaces the chart-managed one). Pinned installs should not self-upgrade;
  # enable only for chart-managed-secret installs that want automatic agent
  # upgrades.
  upgrader:
    enabled: false
