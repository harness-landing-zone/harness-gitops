# The agent's Harness side: the HarnessGitopsAgent and the locked default
# AppProject, in the agent's namespace, on the cluster whose controller
# registers it (the spoke when self-managed, the hub when hub-managed).
# Same keys as charts/gitops-agent (gitopsAgent.*). The teams are
# charts/teams-bootstrap.

# all (default; a self-managed spoke): the agent object and the locked default
# AppProject here. hub: the agent object and the PushSecret (a hub-managed
# spoke, rendered on the hub in namespace <cluster>). spoke: only the locked
# default AppProject (a hub-managed spoke's own side).
target: all

gitopsAgent:
  harnessAgent:
    metadata:
      # Required: the object's name.
      name: ""
    spec:
      # Empty means the identifier.
      name: ""
      scope: ORG
      operator: ARGO
      type: MANAGED_ARGO_PROVIDER
      # Required: the key Secret in the controller's namespace (hga-system).
      apiKeySecretRef: ""
      # Required: the Secret the controller writes the agent's token to, in
      # this namespace. Must equal agent.existingSecrets.agentToken.
      tokenSecretRef: ""
      existingAgentIdentifier: ""
  # The runtime's token Secret; checked against tokenSecretRef when set.
  agent:
    existingSecrets:
      agentToken: ""
  harness:
    identity:
      accountIdentifier: ""
      orgIdentifier: ""
      projectIdentifier: ""
      agentIdentifier: ""
