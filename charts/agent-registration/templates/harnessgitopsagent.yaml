{{- if not (has .Values.target (list "all" "hub" "spoke")) }}
{{- fail "target must be all, hub or spoke" }}
{{- end }}
{{- $a := .Values.gitopsAgent.harnessAgent }}
{{- $id := .Values.gitopsAgent.harness.identity }}
{{- $scope := upper (default "ORG" $a.spec.scope) }}
{{- if not (has $scope (list "ACCOUNT" "ORG" "PROJECT")) }}
{{- fail "gitopsAgent.harnessAgent.spec.scope must be ACCOUNT, ORG or PROJECT" }}
{{- end }}
{{- $token := required "gitopsAgent.harnessAgent.spec.tokenSecretRef is required" $a.spec.tokenSecretRef }}
{{- with .Values.gitopsAgent.agent.existingSecrets.agentToken }}
{{- if ne . $token }}
{{- fail "gitopsAgent.harnessAgent.spec.tokenSecretRef must equal gitopsAgent.agent.existingSecrets.agentToken: the runtime reads the token the controller writes" }}
{{- end }}
{{- end }}
{{- if has .Values.target (list "all" "hub") }}
apiVersion: gitops.harness.io/v1alpha1
kind: HarnessGitopsAgent
metadata:
  name: {{ required "gitopsAgent.harnessAgent.metadata.name is required" $a.metadata.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Delete=false: Argo CD never deletes this, whoever deletes or prunes the
    # Application; deleting it runs the controller finalizer, which deregisters
    # the agent in Harness. Offboarding is a manual delete.
    # SkipDryRunOnMissingResource: the controller's CRDs arrive in the same sync.
    argocd.argoproj.io/sync-options: Delete=false,SkipDryRunOnMissingResource=true
    # After the CRDs and the controller (wave 0).
    argocd.argoproj.io/sync-wave: "1"
spec:
  name: {{ default $id.agentIdentifier $a.spec.name | quote }}
  identifier: {{ required "gitopsAgent.harness.identity.agentIdentifier is required" $id.agentIdentifier | quote }}
  accountId: {{ required "gitopsAgent.harness.identity.accountIdentifier is required" $id.accountIdentifier | quote }}
  {{- if ne $scope "ACCOUNT" }}
  orgId: {{ required "gitopsAgent.harness.identity.orgIdentifier is required for ORG and PROJECT scope" $id.orgIdentifier | quote }}
  {{- end }}
  {{- if eq $scope "PROJECT" }}
  projectId: {{ required "gitopsAgent.harness.identity.projectIdentifier is required for PROJECT scope" $id.projectIdentifier | quote }}
  {{- end }}
  operator: {{ $a.spec.operator | quote }}
  scope: {{ $scope | quote }}
  type: {{ $a.spec.type | quote }}
  apiKeySecretRef: {{ required "gitopsAgent.harnessAgent.spec.apiKeySecretRef is required" $a.spec.apiKeySecretRef | quote }}
  tokenSecretRef: {{ $token | quote }}
  {{- with $a.spec.existingAgentIdentifier }}
  existingAgentIdentifier: {{ . | quote }}
  {{- end }}
{{- end }}
