{{- /*
The agent's locked default AppProject: Argo CD always has one, and it must
allow nothing. The teams' AppProjects come from charts/teams-bootstrap.
Wave 1: after Argo CD's CRDs (wave 0), which may arrive in the same sync,
hence also SkipDryRunOnMissingResource.
*/}}
{{- if has .Values.target (list "all" "spoke") }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: Deny-all. Use the team projects instead.
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: gitops.harness.io
      kind: "*"
{{- end }}
