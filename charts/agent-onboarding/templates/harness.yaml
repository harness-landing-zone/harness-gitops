{{- include "agent-onboarding.validate" . }}
{{- $a := .Values.agent }}
apiVersion: gitops.harness.io/v1alpha1
kind: HarnessGitopsAgent
metadata:
  name: {{ $a.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-onboarding.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  name: {{ $a.name | quote }}
  identifier: {{ $a.identifier | quote }}
  accountId: {{ $a.accountId | quote }}
  orgId: {{ .Values.tenant | quote }}
  operator: {{ default "ARGO" $a.operator | quote }}
  scope: ORG
  type: {{ default "MANAGED_ARGO_PROVIDER" $a.type | quote }}
  apiKeySecretRef: {{ $a.apiKeySecretRef | quote }}
  tokenSecretRef: {{ $a.tokenSecretRef | quote }}
{{- range $team, $t := .Values.teams }}
---
apiVersion: gitops.harness.io/v1alpha1
kind: HarnessGitopsProjectMapping
metadata:
  name: {{ $team | quote }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agent-onboarding.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: {{ $team | quote }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  agentRef:
    name: {{ $a.name | quote }}
  appProject: {{ $team | quote }}
  projectId: {{ $t.projectId | quote }}
  autoCreateServiceEnv: false
{{- end }}
