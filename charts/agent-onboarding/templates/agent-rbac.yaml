{{- include "agent-onboarding.validate" . }}
# Upstream gitops-helm 1.3.0 omits read verbs on deployments/statefulsets in
# its own namespaced gitops-agent Role when createClusterRoles: false. Grant
# read-only access strictly inside this Agent's own namespace so its health
# watchers run without forbidden errors.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitops-agent-own-workloads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-onboarding.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-agent-own-workloads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-onboarding.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitops-agent-own-workloads
subjects:
  - kind: ServiceAccount
    name: gitops-agent
    namespace: {{ .Release.Namespace }}
