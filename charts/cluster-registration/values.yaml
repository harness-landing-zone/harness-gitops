# The Argo CD cluster name and the cluster Secret name. Set by bootstrap/ from
# the member folder name; also the OpenBao key clusters/<clusterName>.
clusterName: ""
# The business unit. Set by bootstrap/ from the member file's path.
tenant: ""
# The stage label (nonprod, prod, ...). From the member file. Required when
# gitopsAgent is true.
stage: ""
# From the member file. true adds the label fleet_member: spoke, which
# spoke-bootstrap selects on.
gitopsAgent: false
# Annotations for the cluster Secret. Set by bootstrap/: repo_url and
# harness_account_id, copied from the hub cluster Secret.
annotations: {}
# The External Secrets store that holds the cluster connections.
store:
  kind: ClusterSecretStore
  name: hub-openbao
# How often ESO re-reads the store (token rotation lands within this time).
refreshInterval: 1m
