# The store (installed once, on the hub), and per fleet member the cluster
# Secret's ExternalSecret plus, when needed, the push resources
# (templates/push.yaml).
#
# The ClusterSecretStore (plus its dev token Secret). The ExternalSecret reads
# from the store of this name. Rendered only on the hub's one store release.
secretStore:
  enabled: false
  name: hub-openbao
# The fleet group in groups/fleet.yaml enables one per fleet member.
externalSecret:
  enabled: false
# The Argo CD cluster name and cluster Secret name come from the member file's
# name in groups/fleet.yaml. OpenBao reads clusters/<clusterName>.
clusterName: ""
# The tenant that owns the cluster (its Harness org; a tenant can be a
# business unit). From the member file.
tenant: ""
# The stage label (nonprod, prod, ...). From the member file. Required when
# model is agent.
stage: ""
# From the member file, required, stamped as label model: agent (the agents
# group in groups/agents.yaml installs an agent) or push (registered only; the
# hub's Argo CD deploys to it). Every member gets fleet_member: spoke.
model: ""
# From the member file, stamped as label addons: who installs this cluster's
# add-ons. hub (the default): the hub's Argo CD pushes them. self: the
# cluster's own Argo CD installs them; refused until that side is built.
addons: hub
# From the member file: extra labels for the cluster Secret. An add-on's
# switch goes here, for example enable_external_secrets: "true"
# (groups/addons.yaml). The labels the chart sets itself are refused.
labels: {}
# The fleet group in groups/fleet.yaml copies repo_url and harness_account_id
# from the hub cluster Secret.
annotations: {}
# How often ESO re-reads the store (token rotation lands within this time).
refreshInterval: 1m
# From the member file: the OpenBao
# path of this spoke's own controller key (property api_key), written by
# workshop/2-clusters (its cluster-values harnessSecretName, the same value);
# must be under harness-api-keys/. Set = the hub
# pushes it to the spoke as hga-system/harness-api-key-secret
# (templates/push.yaml); empty = that Secret is created by hand.
harnessSecretName: ""
