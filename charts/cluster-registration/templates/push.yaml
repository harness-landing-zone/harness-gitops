{{- /*
Hub model only: lets ESO on the hub write into this spoke. The kubeconfig
ExternalSecret builds a Secret from the same store entry as the cluster Secret
(argocd-manager's long-lived token, so it is as powerful as the cluster
Secret). The ClusterSecretStore reads it through authRef, so the spoke's URL
stays in the store and out of git. Only the agent's own hub namespace
(<cluster>) may use the store.
*/}}
{{- if and .Values.externalSecret.enabled (eq .Values.agentModel "hub") }}
{{- $name := .Values.clusterName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-kubeconfig
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # The ESO CRDs may arrive after this Application.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore.name }}
  data:
    {{- range list "server" "caData" "token" }}
    - secretKey: {{ . }}
      remoteRef:
        key: clusters/{{ $name }}
        property: {{ . }}
    {{- end }}
  target:
    name: {{ $name }}-kubeconfig
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        kubeconfig: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: {{ $name }}
              cluster:
                server: {{`{{ .server }}`}}
                certificate-authority-data: {{`{{ .caData }}`}}
          users:
            - name: argocd-manager
              user:
                token: {{`{{ .token }}`}}
          contexts:
            - name: {{ $name }}
              context:
                cluster: {{ $name }}
                user: argocd-manager
          current-context: {{ $name }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: push-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  conditions:
    - namespaces: [{{ $name }}]
  provider:
    kubernetes:
      remoteNamespace: {{ $name }}
      # authRef replaces server and auth: the kubeconfig carries both.
      authRef:
        name: {{ $name }}-kubeconfig
        namespace: {{ .Release.Namespace }}
        key: kubeconfig
{{- end }}
