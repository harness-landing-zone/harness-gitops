{{- if .Values.secretStore.enabled }}
# The store through which ESO reads cluster connections from OpenBao.
# Interface: remoteRef.key
# clusters/<cluster>, properties server, caData, token. It also holds each
# spoke's own controller key at harness-api-keys/<cluster>
# (property api_key, written by workshop/2-clusters), which the hub pushes to
# that spoke (templates/push.yaml). Only ExternalSecrets in hga-hub-agent,
# where the hub's Argo CD keeps its cluster Secrets, may use it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  annotations:
    # ESO's CRDs come from hub-cluster-external-secrets; until they exist, this retries.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  conditions:
    - namespaces:
        - hga-hub-agent
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-dev-root-token
          namespace: openbao
          key: token
---
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# DEV ONLY. THIS IS NOT A CREDENTIAL.
#
# It is the OpenBao chart's published dev-mode root token
# (server.dev.devRootToken, default "root" in openbao-helm 0.30.7). It opens
# only the in-memory dev OpenBao on the hub, which has a ClusterIP Service
# only and loses everything on restart.
#
# When the store goes persistent, DELETE THIS SECRET from the template (and
# the tokenSecretRef above). ESO then authenticates with
# Kubernetes auth (its own ServiceAccount token, plus an OpenBao role and a
# policy that allow read on secret/data/clusters/* and
# secret/data/harness-api-keys/*), and no token lives in git.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
apiVersion: v1
kind: Secret
metadata:
  name: openbao-dev-root-token
  namespace: openbao
type: Opaque
stringData:
  token: root
{{- end }}
