{{- /*
Argo CD repository credentials, built by ESO from one store entry, as Fleet
Management's fleet-secret builds its git secrets, with one type instead of
three switches. Argo CD finds the Secret by its secret-type label.
*/}}
{{- with .Values.repoCredentials }}
{{- if .enabled }}
{{- if not (has .type (list "githubApp" "ssh" "http")) }}
{{- fail (printf "repoCredentials.type %q must be githubApp, ssh or http" .type) }}
{{- end }}
{{- if not (has .secretType (list "repo-creds" "repository")) }}
{{- fail (printf "repoCredentials.secretType %q must be repo-creds or repository" .secretType) }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ default $.Release.Namespace .namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    # The ESO CRDs may arrive after this Application.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secretStore.name }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: {{ .secretType }}
      data:
        type: git
        url: {{ required "repoCredentials.url is required" .url | quote }}
        {{- if eq .type "githubApp" }}
        githubAppID: "{{`{{ .github_app_id }}`}}"
        githubAppInstallationID: "{{`{{ .github_app_installation_id }}`}}"
        githubAppPrivateKey: "{{`{{ .github_private_key }}`}}"
        {{- else if eq .type "ssh" }}
        sshPrivateKey: "{{`{{ .private_key }}`}}"
        {{- else }}
        username: "{{`{{ .username }}`}}"
        password: "{{`{{ .password }}`}}"
        {{- end }}
  dataFrom:
    - extract:
        key: {{ required "repoCredentials.key is required" .key }}
{{- end }}
{{- end }}
