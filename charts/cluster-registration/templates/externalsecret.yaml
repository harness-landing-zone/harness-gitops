{{- if .Values.externalSecret.enabled }}
{{- $re := "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" -}}
{{- $name := required "clusterName is required" .Values.clusterName -}}
{{- if or (gt (len $name) 63) (not (regexMatch $re $name)) -}}
{{- fail (printf "clusterName %q must be a DNS-1123 label (lowercase letters, digits, '-', max 63)" $name) -}}
{{- end -}}
{{- if has $name (list "hub-cluster" "in-cluster") -}}
{{- fail (printf "clusterName %q is reserved by the hub" $name) -}}
{{- end -}}
{{- $tenant := required "tenant is required" .Values.tenant -}}
{{- if not (regexMatch $re $tenant) -}}
{{- fail (printf "tenant %q must be a DNS-1123 label (it becomes a label value)" $tenant) -}}
{{- end -}}
{{- if not (has .Values.model (list "agent" "push")) -}}
{{- fail (printf "model must be agent or push, got %q" (toString .Values.model)) -}}
{{- end -}}
{{- if not (has .Values.addons (list "hub" "self")) -}}
{{- fail (printf "addons must be hub or self, got %q" (toString .Values.addons)) -}}
{{- end -}}
{{- if and (eq .Values.addons "self") (ne .Values.model "agent") -}}
{{- fail "addons: self needs model: agent (a push cluster has no Argo CD of its own)" -}}
{{- end -}}
{{- if not (has .Values.controller (list "hub" "self")) -}}
{{- fail (printf "controller must be hub or self, got %q" (toString .Values.controller)) -}}
{{- end -}}
{{- if and (eq .Values.controller "self") (ne .Values.model "agent") -}}
{{- fail "controller: self needs model: agent (a push cluster runs no agent)" -}}
{{- end -}}
{{- $environment := default .Values.stage .Values.environment -}}
{{- if and (eq .Values.model "agent") (not $environment) -}}
{{- fail "environment is required when model is agent" -}}
{{- end -}}
{{- if and $environment (not (regexMatch $re $environment)) -}}
{{- fail (printf "environment %q must be a DNS-1123 label" $environment) -}}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # The ESO CRDs may arrive after this Application.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore.name }}
  data:
    {{- range list "server" "caData" "token" }}
    - secretKey: {{ . }}
      remoteRef:
        key: clusters/{{ $name }}
        property: {{ . }}
    {{- end }}
  target:
    name: {{ $name }}
    # Owner: deleting this ExternalSecret deletes the cluster Secret.
    creationPolicy: Owner
    # Retain: removing a store entry never empties the Secret.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          tenant: {{ $tenant | quote }}
          {{- with $environment }}
          environment: {{ . | quote }}
          {{- end }}
          fleet_member: spoke
          model: {{ .Values.model }}
          addons: {{ .Values.addons }}
          controller: {{ .Values.controller }}
          {{- range $k, $v := .Values.labels }}
          {{- if has $k (list "argocd.argoproj.io/secret-type" "tenant" "environment" "stage" "fleet_member" "model" "addons" "controller") }}
          {{- fail (printf "labels: %s is set by the chart, not by the member file" $k) }}
          {{- end }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
        {{- with .Values.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      data:
        name: {{ $name }}
        server: "{{`{{ .server }}`}}"
        config: '{"bearerToken":"{{`{{ .token }}`}}","tlsClientConfig":{"caData":"{{`{{ .caData }}`}}"}}'
{{- end }}
