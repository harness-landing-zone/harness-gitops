{{- /*
The Argo CD wall: the org's only destination, restricted to the workload
namespaces and to namespaced resources. It replaces the implicit in-cluster
destination, which bootstrap/orgs.yaml turns off (cluster.inClusterEnabled).
Editing it grants nothing: the Roles exist only in the listed namespaces.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clusterName | default "hub-cluster" | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    argocd.argoproj.io/secret-type: cluster
    {{- include "org-platform.labels" . | nindent 4 }}
    {{- with .Values.clusterLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  name: {{ .Values.clusterName | default "hub-cluster" | quote }}
  server: https://kubernetes.default.svc
  namespaces: {{ join "," .Values.workloadNamespaces | quote }}
  clusterResources: "false"
  # In-cluster: the ServiceAccount token and in-cluster CA, no credentials.
  config: |
    {"tlsClientConfig":{"insecure":false}}
