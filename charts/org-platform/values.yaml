# Fed the same org values file as charts/gitops-agent. Only these keys and
# gitopsAgent.projectMappings[].appProject are read here.

# One AppProject per entry, named by its appProject.
gitopsAgent:
  projectMappings: []

# Where the org's Argo CD may deploy. Required. Drives the Namespaces, the
# Roles and the cluster Secret allowlist, so they cannot drift apart. Each
# must start with "<release namespace>-".
workloadNamespaces: []

# Repos the org's AppProjects may pull from. Empty means deny all.
sourceRepos: []

# Labels for the workload namespaces, for example Pod Security Admission.
namespaceLabels: {}

# Name of the restricted cluster Secret, and the destination name in the org's
# Argo CD.
clusterName: hub-cluster

# false: workloadNamespaces are on the hub, and this chart creates them, the
# Roles and the restricted in-cluster Secret (the hub-namespace mode).
# true: workloadNamespaces are on the remote cluster named clusterName. This
# chart then creates only the AppProjects (and the locked default); the
# cluster's Secret, with a token limited to those namespaces, is written out of
# band by the platform (local/register-spoke.sh on k3d), never from git.
remoteCluster: false

# Extra labels on the cluster Secret. Set by bootstrap/orgs.yaml.
clusterLabels: {}

# Lock the wide-open default AppProject Argo CD creates in every instance.
lockDefaultProject: true
