# PE-managed security boundary + onboarding for one fleet member, driven by
# fleet-members/<name>.yaml:
#
#   mode: agent   (default) Local lower-privilege Org GitOps Agent on this
#                 cluster — Delivery SA + token, team namespaces + workload
#                 Roles, ESO local Kubernetes SecretStore/ExternalSecret
#                 building the restricted cluster Secret, allowlisted
#                 AppProjects, HarnessGitopsAgent, and real project mappings.
#   mode: cluster Remote spoke cluster registration — ExternalSecret reading
#                 connection details (server, caData, token) from a configured
#                 ClusterSecretStore to build an Argo CD cluster Secret on the
#                 hub (for push deployments and/or hub-pushed add-ons).
mode: agent

# Common member identity (from fleet-members/<name>.yaml).
org:
  # DNS-1123 member name (typically the filename of fleet-members/<name>.yaml).
  name: ""
  # Harness organization identifier (lowercase letters and digits only).
  tenant: ""
  # Optional environment label (e.g. dev, test, prod).
  environment: ""

# --- mode: agent settings ----------------------------------------------------

# Restricted Argo CD cluster Secret built declaratively by ESO from the
# delivery ServiceAccount token Secret. Uses
# https://kubernetes.default.svc.cluster.local so Argo CD's implicit in-cluster
# URL (https://kubernetes.default.svc) stays disabled via cluster.inClusterEnabled=false.
clusterSecret:
  # Empty defaults to "<org.name>-workloads" (e.g. bu1-dev-workloads).
  name: ""
  server: https://kubernetes.default.svc.cluster.local
  refreshInterval: 5m

# HarnessGitopsAgent registration (ORG scope). Controller runs in hga-system
# and reads harness-api-key-<tenant> from there.
agent:
  name: ""
  identifier: ""
  accountId: ""
  apiKeySecretRef: ""
  tokenSecretRef: ""
  operator: ARGO
  type: MANAGED_ARGO_PROVIDER

agentReadLogs: false

# Least-privilege Kubernetes Role rules granted to <org>-delivery inside each
# team's workload namespaces.
deliveryRoleRules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

allowedNamespaceResources:
  - group: ""
    kind: ConfigMap
  - group: ""
    kind: Pod
  - group: ""
    kind: Secret
  - group: ""
    kind: Service
  - group: ""
    kind: ServiceAccount
  - group: ""
    kind: PersistentVolumeClaim
  - group: "apps"
    kind: Deployment
  - group: "apps"
    kind: ReplicaSet
  - group: "apps"
    kind: StatefulSet
  - group: "apps"
    kind: DaemonSet
  - group: "batch"
    kind: Job
  - group: "batch"
    kind: CronJob
  - group: "networking.k8s.io"
    kind: Ingress
  - group: "networking.k8s.io"
    kind: NetworkPolicy
  - group: "autoscaling"
    kind: HorizontalPodAutoscaler
  - group: "policy"
    kind: PodDisruptionBudget

# One entry per team, merged from tenants/<tenant>/teams/*/values.yaml.
teams: {}

# --- mode: cluster settings --------------------------------------------------

# Remote cluster registration via ESO (used only when mode: cluster).
remoteCluster:
  # ClusterSecretStore holding remote cluster credentials (server, caData, token).
  secretStore: hub-secret-store
  # Path/key in the secret store. Empty defaults to "clusters/<org.name>".
  remoteKey: ""
  refreshInterval: 1m
  # Optional extra labels (e.g. enable_external_secrets: "true"). Reserved
  # chart-owned labels are refused.
  labels: {}
  # Annotations copied from the hub cluster Secret (repo_url, repo_revision,
  # harness_account_id).
  annotations: {}
