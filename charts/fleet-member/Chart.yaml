apiVersion: v2
name: fleet-member
description: >-
  PE-managed security boundary and Harness onboarding for one managed GitOps
  agent (local namespaced Org agent or remote spoke member): dedicated Delivery
  ServiceAccount + token, team workload namespaces with Pod Security Admission
  and least-privilege workload Roles, namespace-scoped ESO SecretStore +
  ExternalSecret building the agent's restricted Argo CD cluster Secret,
  locked default + allowlisted team AppProjects, HarnessGitopsAgent, and real
  HarnessGitopsProjectMappings.
type: application
version: 0.1.0
