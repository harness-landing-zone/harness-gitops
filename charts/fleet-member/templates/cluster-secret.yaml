{{- if eq (default "agent" .Values.mode) "agent" }}
{{- include "fleet-member.validate" . }}
{{- $org := .Values.org.name }}
{{- $deliveryToken := printf "%s-delivery-token" $org }}
{{- $esoSA := printf "%s-eso-reader" $org }}
{{- $storeName := "local-delivery-token" }}
{{- $clusterName := default (printf "%s-workloads" $org) .Values.clusterSecret.name }}
{{- $server := default "https://kubernetes.default.svc.cluster.local" .Values.clusterSecret.server }}
{{- $namespaces := include "fleet-member.allNamespaces" . }}
{{- if not $namespaces }}
{{- fail "fleet-member: at least one team namespace is required to build the restricted cluster Secret" }}
{{- end }}
# Namespace-scoped ESO reader: can read ONLY the delivery token Secret in this
# namespace so ESO can declaratively assemble the Argo CD cluster Secret without
# OpenBao or tokens in git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $esoSA | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-member.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $esoSA | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-member.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $deliveryToken | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $esoSA | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-member.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $esoSA | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $esoSA | quote }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $storeName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-member.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $esoSA | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $clusterName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-member.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ .Values.clusterSecret.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $storeName }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ $deliveryToken | quote }}
        property: token
    - secretKey: ca
      remoteRef:
        key: {{ $deliveryToken | quote }}
        property: ca.crt
  target:
    name: {{ $clusterName | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
      data:
        name: {{ $clusterName | quote }}
        server: {{ $server | quote }}
        namespaces: {{ $namespaces | quote }}
        clusterResources: "false"
        config: '{"bearerToken":"{{`{{ .token }}`}}","tlsClientConfig":{"caData":"{{`{{ .ca | b64enc }}`}}"}}'
{{- end }}
