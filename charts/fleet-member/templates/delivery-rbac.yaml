{{- if eq (default "agent" .Values.mode) "agent" }}
{{- include "fleet-member.validate" . }}
{{- $org := .Values.org.name }}
{{- $tenant := .Values.org.tenant }}
{{- $deliverySA := printf "%s-delivery" $org }}
{{- $deliveryToken := printf "%s-delivery-token" $org }}
# Dedicated least-privilege delivery identity for this fleet member's Argo CD.
# Never mounted into any pod (automountServiceAccountToken: false); Argo CD
# authenticates with its token through the restricted cluster Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $deliverySA | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-member.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $deliveryToken | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-member.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ $deliverySA | quote }}
    argocd.argoproj.io/sync-wave: "-1"
type: kubernetes.io/service-account-token
---
# Upstream gitops-helm 1.3.0 omits read verbs on deployments/statefulsets in
# its own namespaced gitops-agent Role when createClusterRoles: false. Grant
# read-only access strictly inside this Org namespace so its health watchers
# run without forbidden errors.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitops-agent-own-workloads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-member.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-agent-own-workloads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-member.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitops-agent-own-workloads
subjects:
  - kind: ServiceAccount
    name: gitops-agent
    namespace: {{ .Release.Namespace }}
{{- range $team, $t := .Values.teams }}
{{- range (default (list) $t.namespaces) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . | quote }}
  labels:
    {{- include "fleet-member.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: {{ $team | quote }}
    tenant: {{ $tenant | quote }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "0"
    helm.sh/resource-policy: keep
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-workload-delivery
  namespace: {{ . | quote }}
  labels:
    {{- include "fleet-member.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: {{ $team | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  {{- toYaml $.Values.deliveryRoleRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-workload-delivery
  namespace: {{ . | quote }}
  labels:
    {{- include "fleet-member.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: {{ $team | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-workload-delivery
subjects:
  - kind: ServiceAccount
    name: {{ $deliverySA | quote }}
    namespace: {{ $.Release.Namespace }}
{{- if $.Values.agentReadLogs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-agent-read-logs
  namespace: {{ . | quote }}
  labels:
    {{- include "fleet-member.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-agent-read-logs
  namespace: {{ . | quote }}
  labels:
    {{- include "fleet-member.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-agent-read-logs
subjects:
  - kind: ServiceAccount
    name: gitops-agent
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
