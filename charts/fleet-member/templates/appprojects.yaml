{{- if eq (default "agent" .Values.mode) "agent" }}
{{- include "fleet-member.validate" . }}
{{- $defaultServer := default "https://kubernetes.default.svc.cluster.local" .Values.clusterSecret.server }}
# Locked default AppProject: Argo CD always has one, and it must deny everything.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-member.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: Deny-all. Use the team AppProjects instead.
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: gitops.harness.io
      kind: "*"
    - group: argoproj.io
      kind: "*"
    - group: rbac.authorization.k8s.io
      kind: "*"
{{- range $team, $t := .Values.teams }}
{{- $destinations := list }}
{{- range (default (list) $t.destinations) }}
{{- $destinations = append $destinations (dict "server" (default $defaultServer .server) "namespace" .namespace) }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $team | quote }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fleet-member.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: {{ $team | quote }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: {{ default (printf "Team %s" $team) $t.description | quote }}
  sourceRepos:
    {{- toYaml (default (list) $t.sourceRepos) | nindent 4 }}
  destinations:
    {{- toYaml $destinations | nindent 4 }}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    {{- toYaml $.Values.allowedNamespaceResources | nindent 4 }}
  namespaceResourceBlacklist:
    - group: gitops.harness.io
      kind: "*"
    - group: argoproj.io
      kind: "*"
    - group: rbac.authorization.k8s.io
      kind: "*"
{{- end }}
{{- end }}
