# Day-0 glue for the PE Admin hub. Installed after upstream gitops-helm (which
# installs the Argo CD CRDs), so every resource here is a plain Helm object
# with no hooks or delete/recreate churn on upgrade.

apiKeySecret:
  create: false
  name: harness-api-key-secret
  namespace: hga-system
  value: ""
  extra: {}
  keep: true

gitSecret:
  create: false
  name: bootstrap-repo
  url: ""
  githubAppID: ""
  githubAppInstallationID: ""
  githubAppPrivateKey: ""
  githubAppPrivateKeyB64: ""
  githubAppJson: ""
  repoName: ""
  project: ""
  credsTemplate: false

hubCluster:
  enabled: false
  name: hub-cluster
  server: https://kubernetes.default.svc
  fleetMember: hub-cluster
  labels: {}
  annotations: {}

# Rules of ClusterRole gitops-delivery: what an agent's delivery identity may
# do inside a team namespace it is bound in (charts/fleet-secret).
deliveryRules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Root ApplicationSet: one Application per hub cluster Secret that syncs the
# plain ApplicationSet manifests in `path` into this Argo CD namespace.
rootAppSet:
  enabled: false
  name: fleet-root
  repoURL: ""
  path: bootstrap
  targetRevision: HEAD
  project: platform-admin
  projectDescription: Platform engineering admin AppProject for the hub
  createProject: true
  allowedChartRepos:
    - https://harness.github.io/gitops-helm
    - https://charts.external-secrets.io
