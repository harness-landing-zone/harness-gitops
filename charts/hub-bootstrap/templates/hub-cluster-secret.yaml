{{- $hub := .Values.hubCluster }}
{{- if and $hub $hub.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default "hub-cluster" $hub.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    argocd.argoproj.io/secret-type: cluster
    fleet_member: {{ default "hub-cluster" $hub.fleetMember | quote }}
    {{- include "hub-bootstrap.labels" . | nindent 4 }}
    {{- with $hub.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $hub.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  name: {{ default "hub-cluster" $hub.name | quote }}
  server: {{ default "https://kubernetes.default.svc" $hub.server | quote }}
{{- end }}
