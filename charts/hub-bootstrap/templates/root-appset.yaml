{{- $as := .Values.rootAppSet }}
{{- if and $as $as.enabled }}
{{- $repoURL := default (.Values.gitSecret).url $as.repoURL }}
{{- $revision := default "HEAD" $as.targetRevision }}
{{- $project := default "platform-admin" $as.project }}
{{- $path := default "bootstrap" $as.path }}
{{- if not $repoURL }}
{{- fail "rootAppSet.repoURL is required when gitSecret.url is not set" }}
{{- end }}
{{- if $as.createProject }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $project | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hub-bootstrap.labels" . | nindent 4 }}
spec:
  description: {{ default "Platform engineering admin AppProject" $as.projectDescription | quote }}
  sourceRepos:
    - {{ $repoURL | quote }}
    {{- range $as.allowedChartRepos }}
    - {{ . | quote }}
    {{- end }}
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
{{- end }}
{{- /* Root ApplicationSet (as in EKS Fleet Management and hub-orchestrator): one
Application per hub cluster Secret, syncing the plain ApplicationSet manifests
in rootAppSet.path (non-recursive). Each of those installs charts/application-sets
with its own values catalogue. */}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ default "fleet-root" $as.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hub-bootstrap.labels" . | nindent 4 }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
    applicationsSync: create-update
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: hub-cluster
  template:
    metadata:
      name: {{ default "fleet-root" $as.name | quote }}
    spec:
      project: {{ $project | quote }}
      source:
        repoURL: {{ $repoURL | quote }}
        targetRevision: {{ $revision | quote }}
        path: {{ $path | quote }}
        directory:
          recurse: false
      destination:
        namespace: {{ .Release.Namespace | quote }}
        name: '{{`{{ .name }}`}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        retry:
          limit: 100
          backoff:
            duration: 1m
{{- end }}
