{{- $key := .Values.apiKeySecret }}
{{- $root := . }}
{{- if and $key $key.create }}
{{- $value := required "apiKeySecret.value is required when apiKeySecret.create is true" $key.value -}}
{{- $name := required "apiKeySecret.name is required when apiKeySecret.create is true" $key.name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ default .Release.Namespace $key.namespace }}
  labels:
    {{- include "hub-bootstrap.labels" . | nindent 4 }}
  {{- if $key.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  api_key: {{ $value | quote }}
{{- range $extraName, $extraValue := $key.extra }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $extraName | quote }}
  namespace: {{ default $root.Release.Namespace $key.namespace }}
  labels:
    {{- include "hub-bootstrap.labels" $root | nindent 4 }}
  {{- if $key.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  api_key: {{ required (printf "apiKeySecret.extra.%s needs a value" $extraName) $extraValue | quote }}
{{- end }}
{{- end }}
