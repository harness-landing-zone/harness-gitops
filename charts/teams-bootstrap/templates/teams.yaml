{{- /*
Per team, in waves: its Namespaces (0), its AppProject (1), its mapping (2).
Teams cannot create Namespaces themselves (their AppProject allows no
cluster-scoped kinds), so the platform does. SkipDryRunOnMissingResource: on a
fresh cluster the Argo and Harness CRDs may still be arriving.
*/}}
{{- $agent := required "agentName is required" .Values.agentName }}
{{- $dns := "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" }}
{{- range $team, $t := .Values.teams }}
{{- $prefix := printf "%s-" $team }}
{{- if eq $team "default" }}
{{- fail "teams: \"default\" is reserved, it is the agent's locked AppProject" }}
{{- end }}
{{- if not (regexMatch $dns $team) }}
{{- fail (printf "teams: %q must be lowercase letters, digits and dashes" $team) }}
{{- end }}
{{- range $other, $_ := $.Values.teams }}
{{- if hasPrefix (printf "%s-" $other) $team }}
{{- fail (printf "teams: %q is %q plus a dash, so their namespaces would overlap" $team $other) }}
{{- end }}
{{- end }}
{{- range (default list $t.sourceRepos) }}
{{- if or (contains "*" .) (contains "?" .) (contains "[" .) (hasPrefix "!" .) }}
{{- fail (printf "teams.%s.sourceRepos: %q is a pattern; list exact repository URLs" $team .) }}
{{- end }}
{{- end }}
{{- $destinations := list }}
{{- range (default list $t.destinations) }}
{{- $server := default "https://kubernetes.default.svc" .server }}
{{- if ne $server "https://kubernetes.default.svc" }}
{{- fail (printf "teams.%s.destinations: server %q; teams deploy to this cluster only" $team $server) }}
{{- end }}
{{- /* The team's own prefix keeps it off kube-*, the agent's namespace and
other teams' namespaces. */}}
{{- if not (hasPrefix $prefix (default "" .namespace)) }}
{{- fail (printf "teams.%s.destinations: namespace %q must start with %q" $team .namespace $prefix) }}
{{- end }}
{{- $destinations = append $destinations (dict "server" $server "namespace" .namespace) }}
{{- end }}
{{- range (default list $t.namespaces) }}
{{- if or (not (hasPrefix $prefix .)) (not (regexMatch $dns .)) (gt (len .) 63) }}
{{- fail (printf "teams.%s.namespaces: %q must be a valid namespace name starting with %q" $team . $prefix) }}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . | quote }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: {{ $team | quote }}
    # No privileged pods: a node escape would reach this Argo CD, which is
    # cluster-admin here.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    # They hold the team's workloads: never pruned or deleted with the release.
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "0"
    helm.sh/resource-policy: keep
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $team | quote }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: {{ default (printf "Team %s" $team) $t.description | quote }}
  sourceRepos: {{ toYaml (default list $t.sourceRepos) | nindent 4 }}
  destinations: {{ toYaml $destinations | nindent 4 }}
  clusterResourceWhitelist: []
  {{- /* The controller acts on agent objects in any namespace it can see; no
  team may create one. */}}
  namespaceResourceBlacklist:
    - group: gitops.harness.io
      kind: "*"
---
apiVersion: gitops.harness.io/v1alpha1
kind: HarnessGitopsProjectMapping
metadata:
  name: {{ $team | quote }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    # Delete=false: deleting it runs the controller finalizer, which removes the
    # mapping in Harness. Unmapping a team is a manual delete.
    argocd.argoproj.io/sync-options: Delete=false,SkipDryRunOnMissingResource=true
    # After its AppProject: the controller marks it Ready only once that exists.
    argocd.argoproj.io/sync-wave: "2"
spec:
  agentRef:
    name: {{ $agent | quote }}
  appProject: {{ $team | quote }}
  projectId: {{ required (printf "teams.%s.projectId is required" $team) $t.projectId | quote }}
  # Immutable once the mapping exists.
  autoCreateServiceEnv: false
{{- end }}
