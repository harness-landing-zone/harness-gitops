# Required. The agent and teams entries in groups/agents.yaml set the name of
# the HarnessGitopsAgent that every mapping points at.
agentName: ""

# all (default; a self-managed spoke): namespaces, AppProject and mapping here.
# spoke: namespaces and AppProject only (a hub-managed spoke's own side). hub: the mapping plus a
# deny-all placeholder AppProject of the same name (the controller marks a
# mapping Ready only once an AppProject of that name exists beside the agent
# object; the real one is on the spoke).
target: all

# One entry per team, keyed by the team name (one file per team, merged). The
# name is the AppProject, the mapping and the prefix of every namespace.
#   team-a:
#     projectId: team_a          # required: Harness project in the agent's org
#     description: Team a
#     sourceRepos:               # exact URLs, no patterns
#       - https://github.com/example/team-a.git
#     namespaces: [team-a-dev]   # created by the platform; start "team-a-"
#     destinations:              # this cluster only; namespace starts "team-a-"
#       - server: https://kubernetes.default.svc
#         namespace: team-a-*
# Nothing else is read: no cluster-scoped resources, no gitops.harness.io
# objects, mapping fields fixed.
teams: {}
