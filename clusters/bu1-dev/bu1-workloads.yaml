# Target cluster registered into agent bu1-dev.
#
# Parent folder (bu1-dev) is the target Agent's namespace.
# Filename (bu1-workloads) is the Argo CD Cluster Secret name in that namespace.
#
# mode: local  -> Delivery SA + team workload namespaces + least-privilege RBAC
#                 + local ESO SecretStore/ExternalSecret (no external KMS needed)
# mode: remote -> ESO ExternalSecret pulling {server, caData, token} from a
#                 ClusterSecretStore
mode: local
tenant: bu1
environment: dev
