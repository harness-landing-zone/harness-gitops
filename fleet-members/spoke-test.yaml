# spoke-test is a fleet member because this file exists. The file name is the
# cluster's name: its Argo CD cluster Secret on the hub and its OpenBao entry
# clusters/spoke-test. The store holds only the connection (written by
# workshop/2-clusters/k3d.sh register); how the cluster is bootstrapped is set
# here, and bootstrap/cluster-registration.yaml turns it into the cluster
# Secret's labels.

# The tenant that owns this spoke, and the Harness org the agent registers
# under; its values and teams are in tenants/<tenant>/gitops-agents/. Reviewed
# like any identity: never change it.
tenant: bu1
# The stage folder of tenants/<tenant>/gitops-agents/ (values and teams). There
# is no test/ folder yet, so the spoke gets the defaults and no teams.
stage: test
# true: install a GitOps agent on this cluster (label fleet_member: spoke).
gitopsAgent: true
# The model. "" = self-managed: controller, key and agent objects on this
# spoke. hub = hub-managed: key and agent objects stay on the hub, its
# controller does the work and ESO pushes the token (label agent_model: hub).
agentModel: ""
# Self-managed only: the OpenBao path of this spoke's controller key
# (harness-api-keys/<name>, property api_key, written by workshop/2-clusters).
# The hub pushes it to the spoke as hga-system/harness-api-key-secret; empty =
# that Secret is created by hand. Must stay empty when hub-managed.
harnessSecretName: harness-api-keys/spoke-test