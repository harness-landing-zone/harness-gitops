# spoke-test is a fleet member because this file exists. The file name is the
# cluster's name: its Argo CD cluster Secret on the hub and its OpenBao entry
# clusters/spoke-test. The connection is written by workshop/2-clusters/k3d.sh
# register. The fleet group in groups/fleet.yaml reads this file to configure
# the cluster Secret's labels.

# The tenant that owns this spoke, and the Harness org the agent registers
# under; its values and teams are in tenants/<tenant>/gitops-agents/. Reviewed
# like any identity: never change it.
tenant: bu1
# The stage folder of tenants/<tenant>/gitops-agents/ (values and teams). There
# is no test/ folder yet, so the spoke gets the default values and teams.
stage: test
# agent: install a GitOps agent on this cluster; push: registered only, the
# hub's Argo CD deploys to it. Stamped as label model.
model: agent
# Who installs this spoke's add-ons. hub: the hub's Argo CD pushes them.
# self: the spoke's own Argo CD installs them, so it must be able to read this
# repository. Stamped as label addons.
addons: hub
# Extra labels for the cluster Secret. An add-on's switch goes here and makes
# the hub install that add-on on this spoke, as <spoke>-<add-on>:
#   labels:
#     enable_external_secrets: "true"
# The OpenBao path of this spoke's controller key
# (harness-api-keys/<name>, property api_key, written by workshop/2-clusters).
# The hub pushes it to the spoke as hga-system/harness-api-key-secret; empty =
# that Secret is created by hand.
harnessSecretName: harness-api-keys/spoke-test
