# Fleet member: bu1-dev (filename is the member's immutable identity).
#
# type: agent   -> PE Admin Argo CD deploys a lower-privilege Org GitOps Agent
#                  on this cluster (upstream gitops-helm 1.3.0 with 0 ClusterRoles
#                  and 0 CRDs + charts/fleet-member mode: agent).
# type: cluster -> PE Admin Argo CD registers a remote cluster Secret via ESO
#                  (charts/fleet-member mode: cluster).
type: agent
tenant: bu1
environment: dev
namespace: org-bu1
clusterSecretName: bu1-workloads
