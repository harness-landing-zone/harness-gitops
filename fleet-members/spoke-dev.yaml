# spoke-test is a fleet member because this file exists. The file name is the
# cluster's name: its Argo CD cluster Secret on the hub and its OpenBao entry
# clusters/spoke-test. The connection is written by workshop/2-clusters/k3d.sh
# register. The fleet group in groups/fleet.yaml reads this file to configure
# the cluster Secret's labels.

# The tenant that owns this spoke, and the Harness org the agent registers
# under; its values and teams are in tenants/<tenant>/gitops-agents/. Reviewed
# like any identity: never change it.
tenant: bu1
# The environment folder of tenants/<tenant>/gitops-agents/ (values and teams).
# There is no dev/ folder yet, so this spoke gets the defaults.
environment: dev
# agent: install a GitOps agent on this cluster; push: registered only, the
# hub's Argo CD deploys to it. Stamped as label model.
model: agent
# Who installs this spoke's add-ons. hub: the hub's Argo CD pushes them, which
# is the model in use: the hub does the whole bootstrap and the spoke's agent
# deploys applications. self (the spoke's own Argo CD installs them) is built
# but parked. Stamped as label addons.
addons: hub
# Where the Harness controller, its key, the agent object and the team
# mappings live. self = self-managed: all on this spoke. hub (the default) =
# hub-managed: they stay on the hub, its controller does the work and ESO
# pushes the token. Stamped as label controller.
controller: hub
# Extra labels for the cluster Secret. An add-on's switch goes here: whoever
# installs this spoke's add-ons (see addons above) installs that add-on as
# <spoke>-<add-on>.
labels:
  enable_external_secrets: "true"
