# OpenBao on the hub in dev mode, for the k3d proof only.
#
# Dev mode: one pod, in memory, no unsealing, a KV v2 engine mounted at
# secret/, and the chart's published dev root token (server.dev.devRootToken,
# left at its default). Everything stored is lost on restart.
#
# Going persistent replaces this file: server.standalone or server.ha with
# dataStorage, an init and unseal procedure, and Kubernetes auth for ESO
# instead of the root token.
server:
  dev:
    enabled: true
injector:
  enabled: false
