# The store through which ESO reads cluster connections from OpenBao.
# Interface (notes: openbao-store-interface-2026-11-16.md): remoteRef.key
# clusters/<cluster>, properties server, caData, token. Only ExternalSecrets in
# hga-hub-agent, where the hub's Argo CD keeps its cluster Secrets, may use it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: hub-openbao
  annotations:
    # ESO's CRDs come from hub-external-secrets; until they exist, this retries.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  conditions:
    - namespaces:
        - hga-hub-agent
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-dev-root-token
          namespace: openbao
          key: token
