# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# DEV ONLY. THIS IS NOT A CREDENTIAL.
#
# It is the OpenBao chart's published dev-mode root token
# (server.dev.devRootToken, default "root" in openbao-helm 0.30.7). It opens
# only the in-memory dev OpenBao on the hub, which has a ClusterIP Service
# only and loses everything on restart.
#
# When the store goes persistent, DELETE THIS FILE. ESO then authenticates with
# Kubernetes auth (its own ServiceAccount token, plus an OpenBao role and a
# policy that allow read on secret/data/clusters/*), and no token lives in git.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
apiVersion: v1
kind: Secret
metadata:
  name: openbao-dev-root-token
  namespace: openbao
type: Opaque
stringData:
  token: root
